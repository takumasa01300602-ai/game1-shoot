<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CYBER SQUAD // OVERDRIVE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block}
.hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:5;pointer-events:none}.group{display:flex;gap:7px}
.card{min-width:72px;padding:7px 10px;border:1px solid #31506b;border-radius:12px;background:#06101ccc;backdrop-filter:blur(10px);box-shadow:0 0 18px #00d9ff18}.card b{display:block;font-size:8px;color:#7c9bb2;letter-spacing:1px}.card strong{font-size:17px;color:#d9fbff;text-shadow:0 0 9px #00e5ff}
#boss{position:fixed;top:72px;left:50%;transform:translateX(-50%);width:min(88vw,460px);display:none;z-index:6}.bt{font-size:9px;text-align:center;color:#ff79aa;letter-spacing:2px;margin-bottom:4px}.bar{height:12px;border:1px solid #ff4f88;border-radius:20px;padding:2px;background:#000b}.bar i{display:block;height:100%;width:100%;border-radius:20px;background:linear-gradient(90deg,#ff1768,#ff7b54);box-shadow:0 0 15px #ff1768}
#buff{position:fixed;top:98px;left:50%;transform:translateX(-50%);z-index:6;font-size:10px;font-weight:900;white-space:nowrap;text-shadow:0 0 10px #fff}
#toast{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.7);opacity:0;z-index:9;font-size:25px;font-weight:1000;letter-spacing:2px;text-shadow:0 0 20px currentColor;pointer-events:none}.show{animation:pop .9s ease-out}@keyframes pop{10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-58%) scale(1)}}
#power{position:fixed;right:15px;bottom:18px;width:74px;height:74px;border-radius:50%;border:1px solid #54f6e7;background:#061a1cdd;color:#bffff8;font-weight:1000;font-size:9px;z-index:7;box-shadow:0 0 25px #00ffe044;display:none}.ready{animation:pulse .55s infinite alternate}@keyframes pulse{to{transform:scale(1.08);box-shadow:0 0 40px #00ffe099}}
#mute{position:fixed;left:14px;bottom:18px;width:36px;height:36px;border-radius:50%;border:1px solid #355064;background:#06101ccc;color:#fff;z-index:7}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 38%,#10264dcc,#02030bf5 68%);backdrop-filter:blur(8px);z-index:20}.screen.off{display:none}
.box{max-width:470px}.logo{font-size:clamp(34px,9vw,62px);line-height:.9;font-weight:1000;letter-spacing:2px;color:#aef7ff;text-shadow:0 0 9px #00e5ff,0 0 35px #00e5ff66}.logo em{font-style:normal;color:#ff9ac7;text-shadow:0 0 10px #ff3f8f,0 0 35px #ff3f8f66}.sub{margin:14px 0 22px;color:#8096aa;letter-spacing:3px;font-size:10px}.desc{color:#c5d4df;line-height:1.7;font-size:13px;margin-bottom:22px}.chips{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:23px}.chip{padding:7px 10px;border:1px solid #28455b;border-radius:99px;background:#07111ddd;font-size:9px;color:#a8c1d1}.btn{border:0;border-radius:99px;padding:15px 30px;background:linear-gradient(135deg,#06b6d4,#6366f1,#d946ef);color:white;font-weight:1000;letter-spacing:1px;font-size:15px;box-shadow:0 0 30px #4f46e155}.stats{display:flex;justify-content:center;gap:8px;margin:18px 0 24px}.stat{min-width:90px;padding:10px;border:1px solid #25394a;border-radius:12px;background:#07111ddd}.stat b{display:block;font-size:19px}.stat small{font-size:8px;color:#7990a1;letter-spacing:1px}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;box-shadow:inset 0 0 0 0 #ff005555}.hit{animation:hit .18s}@keyframes hit{50%{box-shadow:inset 0 0 70px 12px #ff005566}}
</style></head><body>
<div id="game"></div><div id="vignette"></div>
<div class="hud"><div class="group"><div class="card"><b>SQUAD</b><strong id="sq">12</strong></div><div class="card"><b>SCORE</b><strong id="sc">0</strong></div></div><div class="group"><div class="card"><b>COMBO</b><strong id="co">x1</strong></div><div class="card"><b>WAVE</b><strong id="wa">1</strong></div></div></div>
<div id="boss"><div class="bt">⚠ A.E.G.I.S. TITAN</div><div class="bar"><i id="bh"></i></div></div><div id="buff"></div><div id="toast"></div><button id="power">OVERDRIVE</button><button id="mute">🔊</button>
<div id="start" class="screen"><div class="box"><div class="logo">CYBER SQUAD<br><em>OVERDRIVE</em></div><div class="sub">NEON SURVIVAL SHOOTER</div><div class="desc">ドラッグで部隊を左右に動かせ。ゲートで人数を増やし、敵を連続撃破してコンボを伸ばせ。<br>パワーコアを集め、52秒後に出現するTITANを撃破しろ。</div><div class="chips"><span class="chip">👆 DRAG MOVE</span><span class="chip">⚡ POWER CORE</span><span class="chip">🔥 COMBO</span><span class="chip">💥 BOSS</span></div><button id="go" class="btn">DEPLOY SQUAD</button></div></div>
<div id="end" class="screen off"><div class="box"><div id="endTitle" class="logo">MISSION CLEAR</div><div id="endDesc" class="desc"></div><div class="stats"><div class="stat"><b id="rs">0</b><small>SCORE</small></div><div class="stat"><b id="rk">0</b><small>KILLS</small></div><div class="stat"><b id="rb">x1</b><small>BEST COMBO</small></div></div><button id="retry" class="btn">REDEPLOY</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
let S,C,R,clk,run=false,t=0,score=0,kills=0,combo=0,best=1,x=0,tx=0,shake=0;
let squad=[],enemies=[],shots=[],eshots=[],gates=[],fx=[],cores=[],boss=null,nextEnemy=.5,nextGate=2,nextBoss=52,ability=0;
let buff={rapid:0,shield:0},audio=null,muted=false;
const lanes=[-3,0,3],DEF=13;
const $=id=>document.getElementById(id);
function tone(f=440,d=.06,type='sine'){if(muted)return;if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}
function toast(s,c='#8ff'){let e=$('toast');e.textContent=s;e.style.color=c;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function mat(c,em=0){return new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:em,metalness:.55,roughness:.28})}
function cube(x,y,z,s,c,e=0){let m=new THREE.Mesh(new THREE.BoxGeometry(...s),mat(c,e));m.position.set(x,y,z);S.add(m);return m}
function soldier(i){let g=new THREE.Group(),body=cube(0,.7,0,[.42,.7,.28],0x27d8ff,.8);g.add(body);let h=new THREE.Mesh(new THREE.SphereGeometry(.19,8,8),mat(0xe7f8ff,.25));h.position.y=1.18;g.add(h);let gun=cube(.3,.7,-.05,[.12,.12,.48],0xf4f4ff,.2);gun.rotation.x=-.1;g.add(gun);g.position.set(x+(i%3-1)*.72,.1,DEF+Math.floor(i/3)*.55);S.add(g);return g}
function setSquad(n){n=Math.max(1,Math.min(45,Math.round(n)));while(squad.length<n)squad.push(soldier(squad.length));while(squad.length>n)S.remove(squad.pop());squad.forEach((g,i)=>{let col=i%7,row=Math.floor(i/7);g.position.x=x+(col-3)*.62;g.position.z=DEF+row*.48})}
function addSquad(n){setSquad(squad.length+n)}
function removeSquad(n){setSquad(squad.length-n);if(squad.length<=1){combo=0;hit()}}
function gate(z,good,val,label){let g=new THREE.Group(),c=good?0x27f0c0:0xff3b75;let a=cube(0,1,z,[.12,2.4, .18],c,1.2);a.position.x=-1.55;let b=a.clone();b.position.x=1.55;g.add(a,b);let p=new THREE.Mesh(new THREE.PlaneGeometry(2.9,1.5),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:.16,side:THREE.DoubleSide}));p.rotation.x=-Math.PI/2;p.position.y=.15;g.add(p);g.position.z=z;g.userData={good,val,label,done:false};S.add(g);gates.push(g)}
function spawnGate(){let left=Math.random()<.5;gate(-48,left,left?Math.ceil(2+Math.random()*5):-(2+Math.floor(Math.random()*4)),left?'+'+Math.ceil(2+Math.random()*5):'−'+(2+Math.floor(Math.random()*4)));let right=!left;gate(-48,right,right?Math.ceil(2+Math.random()*5):-(2+Math.floor(Math.random()*4)),right?'+'+Math.ceil(2+Math.random()*5):'−'+(2+Math.floor(Math.random()*4)))}
function enemyModel(type){let g=new THREE.Group(),c=type==='elite'?0xffd166:type==='tank'?0xff704d:type==='drone'?0xb46cff:type==='bomber'?0xff3f75:0xff426e;let body=new THREE.Mesh(type==='drone'?new THREE.OctahedronGeometry(.55):new THREE.BoxGeometry(.8,.75,.65),mat(c,.9));g.add(body);let eye=cube(0,.08,-.36,[.35,.12,.08],0xffffff,1.5);g.add(eye);if(type==='tank'){let ring=new THREE.Mesh(new THREE.TorusGeometry(.65,.07,6,20),mat(c,1));ring.rotation.x=Math.PI/2;g.add(ring)}S.add(g);return g}
function spawnEnemy(){let r=Math.random(),type=r<.58?'normal':r<.75?'drone':r<.9?'elite':r<.96?'bomber':'tank';let g=enemyModel(type);g.position.set(lanes[Math.floor(Math.random()*3)],.8,-65);enemies.push({g,type,hp:type==='tank'?5:type==='elite'?2:1,spd:type==='tank'?.085:.12+Math.random()*.035,shot:1+Math.random()*2,slide:(Math.random()>.5?1:-1)})}
function fire(){if(!squad.length)return;let b=new THREE.Mesh(new THREE.SphereGeometry(.11,6,6),new THREE.MeshBasicMaterial({color:0x8fffff}));b.position.set(x,.9,DEF-1);S.add(b);shots.push({m:b,v:.65,life:3});if(buff.rapid<=0)tone(650,.025)}
function burst(p,c=0x7df9ff,n=12){for(let i=0;i<n;i++){let q=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.08),new THREE.MeshBasicMaterial({color:c}));q.position.copy(p);S.add(q);fx.push({m:q,v:new THREE.Vector3((Math.random()-.5)*.35,Math.random()*.35+.04,(Math.random()-.5)*.35),life:.45})}}
function kill(i,e){score+=Math.floor(50*(1+combo*.15));kills++;combo++;best=Math.max(best,combo);ability=Math.min(100,ability+3);burst(e.g.position,e.type==='tank'?0xff704d:0xffd166,16);if(Math.random()<.13){let c=new THREE.Mesh(new THREE.OctahedronGeometry(.3),mat(0x70fff0,1));c.position.copy(e.g.position);S.add(c);cores.push({m:c,life:7})}S.remove(e.g);enemies.splice(i,1);tone(780,.045)}
function hit(){ $('vignette').classList.remove('hit');void $('vignette').offsetWidth;$('vignette').classList.add('hit');shake=.7;tone(90,.16,'sawtooth')}
function bossSpawn(){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.IcosahedronGeometry(2.1,1),mat(0xff1768,.9));g.add(body);let ring=new THREE.Mesh(new THREE.TorusGeometry(2.7,.12,8,32),mat(0xff7aab,1));ring.rotation.x=Math.PI/2;g.add(ring);g.position.set(0,2,-72);S.add(g);boss={g,hp:520,max:520,shot:2.2,phase:0};$('boss').style.display='block';toast('⚠ TITAN INCOMING ⚠','#ff4f91');tone(55,.5,'sawtooth')}
function bossShot(){for(let i=-2;i<=2;i++){let m=new THREE.Mesh(new THREE.SphereGeometry(.16,6,6),new THREE.MeshBasicMaterial({color:0xff4f88}));m.position.copy(boss.g.position);S.add(m);eshots.push({m,v:.3,dx:i*.018,life:5})}}
function abilityUse(){if(ability<100||!run)return;ability=0;toast('OVERDRIVE BURST','#f0a4ff');shake=1.1;enemies.forEach(e=>burst(e.g.position,0xf0a4ff,14));enemies.forEach(e=>S.remove(e.g));score+=enemies.length*80;enemies=[];eshots.forEach(b=>S.remove(b.m));eshots=[];if(boss)boss.hp-=85;tone(110,.35,'square')}
function update(){ $('sq').textContent=squad.length;$('sc').textContent=Math.floor(score).toLocaleString();$('co').textContent='x'+Math.max(1,combo);$('wa').textContent=1+Math.floor(t/10);let b=[];if(buff.rapid>0)b.push('⚡ RAPID '+Math.ceil(buff.rapid));if(buff.shield>0)b.push('🛡 SHIELD '+Math.ceil(buff.shield));$('buff').textContent=b.join('   ');let p=$('power');p.style.display=run?'block':'none';p.classList.toggle('ready',ability>=100);p.textContent=ability>=100?'OVERDRIVE':Math.floor(ability)+'%'}
function applyGate(g){if(g.userData.done)return;g.userData.done=true;let v=g.userData.val;if(g.userData.good){addSquad(v);score+=v*25;toast(g.userData.label+' SQUAD','#5fffd0');tone(880,.12)}else{removeSquad(Math.abs(v));toast(g.userData.label+' SQUAD','#ff6c9d');tone(120,.15,'sawtooth')}S.remove(g);gates=gates.filter(x=>x!==g)}
function reset(){[...enemies,...squad,...gates,...shots,...eshots,...fx,...cores].forEach(o=>{let m=o.g||o.m||o;try{S.remove(m)}catch(_){}});enemies=[];squad=[];gates=[];shots=[];eshots=[];fx=[];cores=[];boss=null;t=0;score=0;kills=0;combo=0;best=1;x=0;tx=0;ability=0;buff={rapid:0,shield:0};nextEnemy=.5;nextGate=2;nextBoss=52;$('boss').style.display='none';setSquad(12)}
function start(){if(!S)init();reset();run=true;$('start').classList.add('off');$('end').classList.add('off');toast('DEPLOY!','#8ff');tone(520,.1);clk.start()}
function finish(clear){run=false;$('power').style.display='none';$('boss').style.display='none';$('end').classList.remove('off');$('endTitle').textContent=clear?'MISSION CLEAR':'SQUAD WIPED OUT';$('endDesc').innerHTML=clear?'TITANを撃破した。都市防衛ラインを確保。':'防衛ラインが突破された。もう一度挑戦しよう。';$('rs').textContent=Math.floor(score).toLocaleString();$('rk').textContent=kills;$('rb').textContent='x'+best}
function init(){S=new THREE.Scene();S.background=new THREE.Color(0x02030b);S.fog=new THREE.FogExp2(0x030817,.012);C=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,180);C.position.set(0,10,20);C.lookAt(0,1,-35);R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.outputEncoding=THREE.sRGBEncoding;$('game').appendChild(R.domElement);clk=new THREE.Clock();
S.add(new THREE.HemisphereLight(0x9defff,0x080012,1.1));let l=new THREE.DirectionalLight(0xffffff,1.2);l.position.set(3,8,8);S.add(l);
let road=new THREE.Mesh(new THREE.PlaneGeometry(14,180),new THREE.MeshStandardMaterial({color:0x07101b,roughness:.7,metalness:.3}));road.rotation.x=-Math.PI/2;road.position.z=-35;S.add(road);
for(let i=-3;i<=3;i+=3){let line=new THREE.Mesh(new THREE.BoxGeometry(.045,.025,180),new THREE.MeshBasicMaterial({color:0x0ad9ff}));line.position.set(i,.03,-35);S.add(line)}
for(let i=0;i<70;i++){let h=2+Math.random()*12,w=1.5+Math.random()*3,d=2+Math.random()*4,side=Math.random()<.5?-1:1;let b=cube(side*(8+Math.random()*10),h/2,-Math.random()*150,[w,h,d],0x081326,.15);if(Math.random()<.7){let win=new THREE.Mesh(new THREE.BoxGeometry(w*.75,.04,.03),new THREE.MeshBasicMaterial({color:Math.random()<.5?0x00eaff:0xff3b9d}));win.position.set(b.position.x,b.position.y+Math.random()*h/2,b.position.z-d/2-.02);S.add(win)}}
for(let i=0;i<180;i++){let s=new THREE.Mesh(new THREE.SphereGeometry(.025,4,4),new THREE.MeshBasicMaterial({color:0x9be7ff}));s.position.set((Math.random()-.5)*80,5+Math.random()*35,-Math.random()*160);S.add(s)}
setSquad(12);window.addEventListener('resize',()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});let down=false;R.domElement.addEventListener('pointerdown',e=>{down=true;tx=((e.clientX/innerWidth)-.5)*8});R.domElement.addEventListener('pointermove',e=>{if(down)tx=((e.clientX/innerWidth)-.5)*8});window.addEventListener('pointerup',()=>down=false);animate()}
function animate(){requestAnimationFrame(animate);let dt=Math.min(.035,clk?clk.getDelta():.016);if(run){t+=dt;x+=(Math.max(-4.2,Math.min(4.2,tx))-x)*.16;C.position.x+=(x*.12-C.position.x)*.08;C.position.y=10+Math.sin(t*2)*.04;C.lookAt(x*.06,1,-35);
if(t>nextBoss&&!boss){bossSpawn();nextBoss=999}
nextEnemy-=dt;if(nextEnemy<=0&&!boss){spawnEnemy();nextEnemy=Math.max(.32,1.0-t*.008)}
nextGate-=dt;if(nextGate<=0&&!boss){spawnGate();nextGate=6.2}
if(t>nextBoss-3&&!boss){ }
if(t>0){fire();if(buff.rapid>0)fire()}
squad.forEach((g,i)=>{g.position.x+=(x+(i%7-3)*.62-g.position.x)*.25;g.position.z+=(DEF+Math.floor(i/7)*.48-g.position.z)*.25;g.rotation.y=Math.sin(t*4+i)*.04});
for(let i=shots.length-1;i>=0;i--){let b=shots[i];b.m.position.z-=b.v;b.life-=dt;let rem=b.life<=0;for(let j=enemies.length-1;j>=0&&!rem;j--){let e=enemies[j];if(b.m.position.distanceTo(e.g.position)<.75){e.hp--;burst(b.m.position,0xffffaa,3);rem=true;if(e.hp<=0)kill(j,e)}}if(boss&&!rem&&b.m.position.distanceTo(boss.g.position)<2.4){boss.hp-=buff.rapid>0?2:1;burst(b.m.position,0xffa4d2,2);rem=true}if(rem){S.remove(b.m);shots.splice(i,1)}}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.g.position.z+=e.spd;e.shot-=dt;if(e.type==='drone'||e.type==='elite')e.g.position.x+=Math.sin(t*2+i)*.012;if(e.shot<=0){e.shot=1.4+Math.random()*1.2;let m=new THREE.Mesh(new THREE.SphereGeometry(.13,6,6),new THREE.MeshBasicMaterial({color:0xff426e}));m.position.copy(e.g.position);S.add(m);eshots.push({m,v:.3,dx:(x-e.g.position.x)*.012,life:5})}if(e.type==='bomber'&&e.g.position.z>9){if(Math.abs(e.g.position.x-x)<1.5){if(buff.shield>0){buff.shield=0;toast('SHIELD SAVED YOU','#9effc9')}else removeSquad(5);hit()}burst(e.g.position,0xff3b75,25);S.remove(e.g);enemies.splice(i,1)}else if(e.g.position.z>DEF){if(buff.shield>0){buff.shield=0;toast('SHIELD BREAK','#9effc9')}else{finish(false);break}S.remove(e.g);enemies.splice(i,1)}}
for(let i=eshots.length-1;i>=0;i--){let b=eshots[i];b.m.position.z+=b.v;b.m.position.x+=b.dx;b.life-=dt;if(b.life<=0||b.m.position.z>16){S.remove(b.m);eshots.splice(i,1);continue}if(Math.abs(b.m.position.x-x)<.55&&b.m.position.z>11.5){if(buff.shield>0){buff.shield=0;toast('SHIELD HIT','#9effc9')}else{removeSquad(1);combo=0;hit()}S.remove(b.m);eshots.splice(i,1)}}
for(let i=gates.length-1;i>=0;i--){let g=gates[i];g.position.z+=.18;if(!g.userData.done&&Math.abs(g.position.z-DEF)<1&&Math.abs(x-g.position.x)<1.5)applyGate(g);if(g.position.z>18){S.remove(g);gates.splice(i,1)}}
for(let i=cores.length-1;i>=0;i--){let c=cores[i];c.m.rotation.x+=dt*3;c.m.rotation.y+=dt*4;c.life-=dt;if(c.m.position.distanceTo(new THREE.Vector3(x,.8,DEF))<1.1){buff.rapid=7;buff.shield=5;ability=Math.min(100,ability+25);toast('POWER CORE!','#72fff0');burst(c.m.position,0x72fff0,15);S.remove(c.m);cores.splice(i,1);tone(1000,.12)}else if(c.life<=0){S.remove(c.m);cores.splice(i,1)}}
if(boss){boss.g.position.z+=.035;boss.g.position.x=Math.sin(t*.7)*2.2;boss.g.rotation.y+=dt*.8;boss.g.children[1].rotation.z+=dt*2;boss.shot-=dt;if(boss.shot<=0){boss.shot=boss.hp<250?1.1:2.0;bossShot();toast(boss.hp<250?'TITAN FRENZY':'TITAN ATTACK','#ff5a92')}if(boss.hp<=0)finish(true);$('bh').style.width=Math.max(0,boss.hp/boss.max*100)+'%'}
buff.rapid=Math.max(0,buff.rapid-dt);buff.shield=Math.max(0,buff.shield-dt);ability=Math.min(100,ability+dt*(boss?1.4:.35));update();
for(let i=fx.length-1;i>=0;i--){let p=fx[i];p.m.position.addScaledVector(p.v,1);p.v.y-=dt*.5;p.life-=dt;p.m.scale.setScalar(Math.max(.05,p.life*2));if(p.life<=0){S.remove(p.m);fx.splice(i,1)}}
}
