<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Squad Rush Hyper 3D</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 上部HUD */
    .hud {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .badge {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #squad-count {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 900;
    }
    #score-badge { color: #facc15; border-color: rgba(250, 204, 21, 0.4); }

    /* フィーバーゲージ */
    #fever-container {
      position: absolute;
      top: calc(env(safe-area-inset-top, 14px) + 48px);
      left: 50%;
      transform: translateX(-50%);
      width: 60%;
      max-width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    #fever-label {
      font-size: 10px;
      font-weight: 900;
      color: #a855f7;
      letter-spacing: 1px;
      margin-bottom: 2px;
      text-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
    }
    .fever-bar-bg {
      width: 100%;
      height: 8px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #a855f7;
      border-radius: 6px;
      overflow: hidden;
    }
    #fever-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #a855f7, #ec4899, #f43f5e);
      transition: width 0.1s linear;
    }

    /* コンボポップアップ */
    #combo-popup {
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      color: #facc15;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.8), 0 4px 8px #000;
      pointer-events: none;
      opacity: 0;
      z-index: 20;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.2s;
    }

    /* ボスHPバー */
    #boss-hud {
      position: absolute;
      top: calc(env(safe-area-inset-top, 14px) + 76px);
      left: 50%;
      transform: translateX(-50%);
      width: 75%;
      max-width: 300px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    #boss-name {
      color: #ef4444;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 3px;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
    }
    .boss-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(0, 0, 0, 0.8);
      border: 1.5px solid #ef4444;
      border-radius: 6px;
      overflow: hidden;
    }
    #boss-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f87171, #dc2626);
      transition: width 0.1s linear;
    }

    /* 画面オーバーレイ */
    .overlay-screen {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.88) 0%, rgba(2, 6, 23, 0.96) 100%);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }
    .screen-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
    }
    .screen-desc {
      font-size: 13px;
      color: #94a3b8;
      max-width: 300px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-main {
      padding: 16px 44px;
      font-size: 17px;
      font-weight: 900;
      border: none;
      border-radius: 36px;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #fff;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.5);
      cursor: pointer;
      outline: none;
    }
    .btn-main:active { transform: scale(0.96); }

    #error-log {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      color: #f87171;
      font-size: 11px;
      background: rgba(0,0,0,0.85);
      padding: 6px;
      border-radius: 4px;
      display: none;
      z-index: 100;
      word-break: break-all;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="error-log"></div>

    <div class="hud">
      <div id="squad-badge" class="badge">
        <span>SQUAD:</span>
        <span id="squad-count">1</span>
      </div>
      <div id="score-badge" class="badge">SCORE: 0</div>
    </div>

    <!-- フィーバーゲージ -->
    <div id="fever-container">
      <div id="fever-label">⚡ FEVER GAUGE ⚡</div>
      <div class="fever-bar-bg">
        <div id="fever-bar-fill"></div>
      </div>
    </div>

    <!-- コンボ文字 -->
    <div id="combo-popup">GREAT!</div>

    <!-- ボスHPバー -->
    <div id="boss-hud">
      <div id="boss-name">⚠ TITAN MECH OMEGA ⚠</div>
      <div class="boss-bar-bg">
        <div id="boss-bar-fill"></div>
      </div>
    </div>

    <!-- スタート画面 -->
    <div id="start-screen" class="overlay-screen">
      <h1 class="screen-title" style="color: #38bdf8;">SQUAD RUSH EX</h1>
      <p class="screen-desc">
        【新要素】<b>ゲートを撃つと数字が育つ！</b><br>
        青ゲートを撃って育て、赤ゲートは撃って破壊せよ！<br>
        ドラム缶爆破とフィーバー無双で防衛ラインを守り抜け。
      </p>
      <button id="start-btn" class="btn-main">TAP TO BATTLE</button>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="overlay-screen" style="display: none;">
      <h1 id="result-title" class="screen-title">MISSION COMPLETE</h1>
      <p id="result-desc" class="screen-desc"></p>
      <button id="retry-btn" class="btn-main">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      const err = document.getElementById('error-log');
      err.style.display = 'block';
      err.innerText = `Error (${line}): ${msg}`;
    };

    // --- Web Audio リアルタイムBGM & SFX ---
    let audioCtx = null;
    let bgmStep = 0;
    let bgmTimer = 0;
    const BGM_TEMPO = 0.13; // 16分音符の速度
    const BASS_NOTES = [110, 110, 130.81, 110, 146.83, 110, 130.81, 98];

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBgmStep() {
      if (!audioCtx || !isPlaying) return;
      const now = audioCtx.currentTime;

      // 1. ベースライン
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      const note = BASS_NOTES[bgmStep % BASS_NOTES.length] / 2;
      osc.frequency.setValueAtTime(note, now);

      gain.gain.setValueAtTime(0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.12);

      // 2. キック＆スネア（ビート）
      if (bgmStep % 4 === 0) {
        // キック
        const kOsc = audioCtx.createOscillator();
        const kGain = audioCtx.createGain();
        kOsc.frequency.setValueAtTime(140, now);
        kOsc.frequency.exponentialRampToValueAtTime(35, now + 0.08);
        kGain.gain.setValueAtTime(0.08, now);
        kGain.gain.linearRampToValueAtTime(0.001, now + 0.08);
        kOsc.connect(kGain);
        kGain.connect(audioCtx.destination);
        kOsc.start(now);
        kOsc.stop(now + 0.08);
      } else if (bgmStep % 4 === 2) {
        // スネアノイズ
        const sOsc = audioCtx.createOscillator();
        const sGain = audioCtx.createGain();
        sOsc.type = 'triangle';
        sOsc.frequency.setValueAtTime(220, now);
        sGain.gain.setValueAtTime(0.03, now);
        sGain.gain.linearRampToValueAtTime(0.001, now + 0.06);
        sOsc.connect(sGain);
        sGain.connect(audioCtx.destination);
        sOsc.start(now);
        sOsc.stop(now + 0.06);
      }

      bgmStep++;
    }

    function playSfx(type) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'shoot') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.04);
          gain.gain.setValueAtTime(0.03, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.04);
          osc.start(now);
          osc.stop(now + 0.04);
        } else if (type === 'gate_grow') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'barrel_boom') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(25, now + 0.4);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
          osc.start(now);
          osc.stop(now + 0.4);
        } else if (type === 'fever_start') {
          [440, 554, 659, 880].forEach((f, i) => {
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.connect(g);
            g.connect(audioCtx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(f, now + i * 0.05);
            g.gain.setValueAtTime(0.1, now + i * 0.05);
            g.gain.linearRampToValueAtTime(0.001, now + 0.35);
            o.start(now + i * 0.05);
            o.stop(now + 0.35);
          });
        }
      } catch (e) {}
    }

    // --- ゲーム設定 & 状態 ---
    const BRIDGE_WIDTH = 9.0;
    const DEFENSE_Z = 13.0;
    let isPlaying = false;
    let score = 0;
    let gameTime = 0;
    let spawnTimer = 0;
    let gateTimer = 0;
    let barrelTimer = 0;
    let bossSpawned = false;
    let shakeIntensity = 0;

    // フィーバー & コンボ
    let feverGauge = 0;
    let isFeverTime = false;
    let feverTimer = 0;
    let comboCount = 0;

    // Three.js
    let scene, camera, renderer;
    let playerLeaderX = 0;
    let targetLeaderX = 0;
    let cyberFloor;

    // エンティティ
    let squadMembers = [];
    let bullets = [];
    let enemies = [];
    let gates = [];
    let barrels = [];
    let particles = [];
    let boss = null;

    // --- テクスチャ ---
    function createCyberGrid() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#020617'; ctx.fillRect(0,0,512,512);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.22)'; ctx.lineWidth = 4;
      for (let i=0; i<=512; i+=64) {
        ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,512); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(512,i); ctx.stroke();
      }
      return new THREE.CanvasTexture(c);
    }

    function createGateTexture(label, isPositive) {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = isPositive ? 'rgba(2, 132, 199, 0.65)' : 'rgba(220, 38, 38, 0.65)';
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = isPositive ? '#38bdf8' : '#f87171';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, 242, 242);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 84px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = isPositive ? '#0284c7' : '#991b1b';
      ctx.shadowBlur = 20;
      ctx.fillText(label, 128, 128);

      return new THREE.CanvasTexture(c);
    }

    // --- 3Dモデル ---
    function createSoldierMesh(isLeader = false) {
      const group = new THREE.Group();
      const bColor = isLeader ? 0x0284c7 : 0x0ea5e9;

      const bodyGeo = new THREE.BoxGeometry(0.5, 0.6, 0.35);
      const bodyMat = new THREE.MeshLambertMaterial({ color: bColor });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.5;
      group.add(body);

      const headGeo = new THREE.BoxGeometry(0.38, 0.38, 0.38);
      const headMat = new THREE.MeshLambertMaterial({ color: 0xfacc15 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.0;
      group.add(head);

      const visorGeo = new THREE.BoxGeometry(0.32, 0.12, 0.08);
      const visorMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const visor = new THREE.Mesh(visorGeo, visorMat);
      visor.position.set(0, 1.02, -0.18);
      group.add(visor);

      const legGeo = new THREE.BoxGeometry(0.16, 0.3, 0.2);
      const legMat = new THREE.MeshLambertMaterial({ color: 0x1e293b });
      const legL = new THREE.Mesh(legGeo, legMat);
      legL.position.set(-0.14, 0.15, 0);
      const legR = new THREE.Mesh(legGeo, legMat);
      legR.position.set(0.14, 0.15, 0);
      group.add(legL, legR);

      return { group, legL, legR };
    }

    function createEnemyMesh(type) {
      const group = new THREE.Group();
      let color = 0xef4444;
      let scale = 1.0;

      if (type === 'fast') { color = 0xa855f7; scale = 0.75; }
      if (type === 'heavy') { color = 0xf59e0b; scale = 1.4; }
      if (type === 'bomber') { color = 0xff0044; scale = 0.85; }

      const bodyGeo = new THREE.BoxGeometry(0.5 * scale, 0.6 * scale, 0.35 * scale);
      const bodyMat = new THREE.MeshLambertMaterial({ color });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.5 * scale;
      group.add(body);

      const headGeo = new THREE.BoxGeometry(0.38 * scale, 0.38 * scale, 0.38 * scale);
      const headMat = new THREE.MeshLambertMaterial({ color: 0x0f172a });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.y = 1.0 * scale;
      group.add(head);

      if (type === 'bomber') {
        // 自爆爆弾を背中に背負う
        const bombGeo = new THREE.SphereGeometry(0.35, 8, 8);
        const bombMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const bomb = new THREE.Mesh(bombGeo, bombMat);
        bomb.position.set(0, 0.8, -0.3);
        group.add(bomb);
      }

      return group;
    }

    function createBarrelMesh() {
      const group = new THREE.Group();
      const geo = new THREE.CylinderGeometry(0.55, 0.55, 1.2, 12);
      const mat = new THREE.MeshLambertMaterial({ color: 0xdc2626 });
      const cylinder = new THREE.Mesh(geo, mat);
      cylinder.position.y = 0.6;
      group.add(cylinder);

      // 黄色い危険帯
      const stripeGeo = new THREE.CylinderGeometry(0.57, 0.57, 0.3, 12);
      const stripeMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
      const stripe = new THREE.Mesh(stripeGeo, stripeMat);
      stripe.position.y = 0.6;
      group.add(stripe);

      return group;
    }

    function createBossMesh() {
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 3.0, 2.0), new THREE.MeshLambertMaterial({ color: 0x991b1b }));
      body.position.y = 2.4;
      group.add(body);

      const core = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.25), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
      core.position.set(0, 2.4, 1.05);
      group.add(core);

      const head = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.3, 1.3), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
      head.position.y = 4.4;
      group.add(head);

      return group;
    }

    // --- 初期セットアップ ---
    function init() {
      const container = document.getElementById('game-container');
      const w = container.clientWidth;
      const h = container.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x020617);
      scene.fog = new THREE.FogExp2(0x020617, 0.016);

      camera = new THREE.PerspectiveCamera(54, w / h, 0.1, 200);
      camera.position.set(0, 15, 23);
      camera.lookAt(0, 1, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0x38bdf8, 0x0f172a, 0.75);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(12, 25, 15);
      scene.add(dirLight);

      // 床
      const floorTex = createCyberGrid();
      floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
      floorTex.repeat.set(16, 32);
      cyberFloor = new THREE.Mesh(new THREE.PlaneGeometry(160, 240), new THREE.MeshBasicMaterial({ map: floorTex }));
      cyberFloor.rotation.x = -Math.PI / 2;
      cyberFloor.position.set(0, -6, -30);
      scene.add(cyberFloor);

      // 橋
      const bridge = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE_WIDTH, 0.6, 120), new THREE.MeshLambertMaterial({ color: 0x0f172a }));
      bridge.position.set(0, -0.3, -35);
      scene.add(bridge);

      // レール
      const railGeo = new THREE.BoxGeometry(0.35, 0.5, 120);
      const railMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const rL = new THREE.Mesh(railGeo, railMat);
      rL.position.set(-BRIDGE_WIDTH / 2, 0.25, -35);
      const rR = rL.clone();
      rR.position.x = BRIDGE_WIDTH / 2;
      scene.add(rL, rR);

      // 防衛ライン
      const defLine = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE_WIDTH, 0.05, 0.3), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
      defLine.position.set(0, 0.05, DEFENSE_Z + 1.2);
      scene.add(defLine);

      setupTouchInput();
      window.addEventListener('resize', onResize);
      animate();
    }

    function setupTouchInput() {
      let isDragging = false;
      let startX = 0;
      let basePlayerX = 0;

      const onStart = (cx) => { isDragging = true; startX = cx; basePlayerX = targetLeaderX; };
      const onMove = (cx) => {
        if (!isDragging || !isPlaying) return;
        const dx = (cx - startX) * 0.024;
        const maxRange = BRIDGE_WIDTH / 2 - 0.7;
        targetLeaderX = Math.max(-maxRange, Math.min(maxRange, basePlayerX + dx));
      };
      const onEnd = () => { isDragging = false; };

      window.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
      window.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
      window.addEventListener('touchend', onEnd);
      window.addEventListener('mousedown', (e) => onStart(e.clientX));
      window.addEventListener('mousemove', (e) => onMove(e.clientX));
      window.addEventListener('mouseup', onEnd);
    }

    function onResize() {
      const c = document.getElementById('game-container');
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(c.clientWidth, c.clientHeight);
    }

    // --- 部隊編成 ---
    function updateSquadFormation() {
      const count = squadMembers.length;
      document.getElementById('squad-count').innerText = count;

      squadMembers.forEach((member, i) => {
        if (i === 0) { member.offsetX = 0; member.offsetZ = 0; return; }
        const row = Math.floor(Math.sqrt(i));
        const col = i - row * row;
        const spacingX = 0.52;
        const spacingZ = 0.62;
        member.offsetX = -((row * spacingX) / 2) + col * spacingX;
        member.offsetZ = row * spacingZ;
      });
    }

    function addSquad(n) {
      const cur = squadMembers.length;
      const target = Math.min(65, cur + n);
      for (let i = cur; i < target; i++) {
        const s = createSoldierMesh(false);
        s.group.position.set(playerLeaderX, 0, DEFENSE_Z);
        s.group.scale.set(0.1, 0.1, 0.1);
        scene.add(s.group);
        squadMembers.push({ mesh: s.group, legL: s.legL, legR: s.legR, offsetX: 0, offsetZ: 0 });
      }
      updateSquadFormation();
    }

    function removeSquad(n) {
      if (squadMembers.length <= 1) return;
      const cnt = Math.min(n, squadMembers.length - 1);
      for (let i = 0; i < cnt; i++) {
        const m = squadMembers.pop();
        spawnParticles(m.mesh.position.x, 0.6, m.mesh.position.z, 0xef4444, 6);
        scene.remove(m.mesh);
      }
      updateSquadFormation();
    }

    // --- ゲート管理（撃って育つシステム） ---
    function spawnGateSet() {
      const z = -65;
      const w = BRIDGE_WIDTH / 2 - 0.35;
      const isLeftGood = Math.random() < 0.5;

      const g1 = createGate(isLeftGood ? 5 : -4, isLeftGood, -w / 2 - 0.15, z, w);
      const g2 = createGate(!isLeftGood ? 5 : -4, !isLeftGood, w / 2 + 0.15, z, w);
      gates.push(g1, g2);
    }

    function createGate(val, isPositive, x, z, width) {
      const group = new THREE.Group();
      const geo = new THREE.PlaneGeometry(width, 2.8);
      const mat = new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide });
      const panel = new THREE.Mesh(geo, mat);
      panel.position.y = 1.5;
      group.add(panel);

      const pL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3.2, 0.2), new THREE.MeshBasicMaterial({ color: isPositive ? 0x38bdf8 : 0xef4444 }));
      pL.position.set(-width / 2, 1.5, 0);
      const pR = pL.clone();
      pR.position.x = width / 2;
      group.add(pL, pR);

      group.position.set(x, 0, z);
      scene.add(group);

      const obj = {
        mesh: group,
        panel,
        val,
        isPositive,
        width,
        applied: false
      };
      updateGateTexture(obj);
      return obj;
    }

    function updateGateTexture(g) {
      const label = g.isPositive ? `+${g.val}` : `${g.val}`;
      g.panel.material.map = createGateTexture(label, g.isPositive);
      g.panel.material.needsUpdate = true;
    }

    // --- ドラム缶スポーン ---
    function spawnBarrel() {
      const b = createBarrelMesh();
      const x = (Math.random() - 0.5) * (BRIDGE_WIDTH - 2.5);
      b.position.set(x, 0, -65);
      scene.add(b);
      barrels.push({ mesh: b, hp: 4 });
    }

    // --- コンボ演出 ---
    function triggerCombo() {
      comboCount++;
      const el = document.getElementById('combo-popup');
      if (comboCount % 5 === 0) {
        let msg = `${comboCount} COMBO!`;
        if (comboCount >= 20) msg = "UNSTOPPABLE!! 🔥";
        else if (comboCount >= 10) msg = "SUPERB!! ⚡";
        el.innerText = msg;
        el.style.opacity = '1';
        el.style.transform = 'translate(-50%, -50%) scale(1.2)';
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translate(-50%, -50%) scale(0.6)';
        }, 600);
      }
    }

    // --- スタート / リセット ---
    function startGame() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';

      squadMembers.forEach(m => scene.remove(m.mesh));
      bullets.forEach(b => scene.remove(b.mesh));
      enemies.forEach(e => scene.remove(e.mesh));
      gates.forEach(g => scene.remove(g.mesh));
      barrels.forEach(b => scene.remove(b.mesh));
      particles.forEach(p => scene.remove(p.mesh));
      if (boss) scene.remove(boss.mesh);

      squadMembers = [];
      bullets = [];
      enemies = [];
      gates = [];
      barrels = [];
      particles = [];
      boss = null;

      score = 0;
      gameTime = 0;
      spawnTimer = 0;
      gateTimer = 1.0;
      barrelTimer = 3.0;
      bossSpawned = false;
      playerLeaderX = 0;
      targetLeaderX = 0;
      feverGauge = 0;
      isFeverTime = false;
      comboCount = 0;

      const leader = createSoldierMesh(true);
      leader.group.position.set(0, 0, DEFENSE_Z);
      scene.add(leader.group);
      squadMembers.push({ mesh: leader.group, legL: leader.legL, legR: leader.legR, offsetX: 0, offsetZ: 0 });

      updateSquadFormation();
      document.getElementById('score-badge').innerText = `SCORE: 0`;
      document.getElementById('boss-hud').style.display = 'none';
      document.getElementById('fever-bar-fill').style.width = '0%';

      isPlaying = true;
    }

    // --- パーティクル ---
    function spawnParticles(x, y, z, color, count = 10, isSpark = false) {
      for (let i = 0; i < count; i++) {
        const geo = isSpark ? new THREE.SphereGeometry(0.1, 4, 4) : new THREE.BoxGeometry(0.14, 0.14, 0.14);
        const mat = new THREE.MeshBasicMaterial({ color });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        particles.push({
          mesh,
          vx: (Math.random() - 0.5) * 0.35,
          vy: Math.random() * 0.3 + 0.1,
          vz: (Math.random() - 0.5) * 0.35,
          life: 0.6
        });
      }
    }

    // --- メインループ ---
    let shootTimer = 0;
    function animate() {
      requestAnimationFrame(animate);

      const delta = 0.016;

      if (isPlaying) {
        gameTime += delta;

        // BGM テンポ更新
        bgmTimer -= delta;
        if (bgmTimer <= 0) {
          playBgmStep();
          bgmTimer = BGM_TEMPO;
        }

        // 背景スクロール
        if (cyberFloor) cyberFloor.material.map.offset.y -= 0.01;

        // シェイク
        if (shakeIntensity > 0) {
          camera.position.x = (Math.random() - 0.5) * shakeIntensity;
          camera.position.y = 15 + (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity *= 0.88;
          if (shakeIntensity < 0.01) {
            shakeIntensity = 0;
            camera.position.set(0, 15, 23);
          }
        }

        // フィーバー管理
        if (isFeverTime) {
          feverTimer -= delta;
          document.getElementById('fever-bar-fill').style.width = `${(feverTimer / 5.0) * 100}%`;
          if (feverTimer <= 0) {
            isFeverTime = false;
            feverGauge = 0;
            document.getElementById('fever-label').innerText = "⚡ FEVER GAUGE ⚡";
            document.getElementById('fever-label').style.color = "#a855f7";
          }
        }

        // リーダー追従
        playerLeaderX += (targetLeaderX - playerLeaderX) * 0.22;

        // 部隊アニメーション
        const walkCycle = Math.sin(gameTime * 22);
        squadMembers.forEach((m) => {
          m.mesh.position.x += (playerLeaderX + m.offsetX - m.mesh.position.x) * 0.25;
          m.mesh.position.z += (DEFENSE_Z + m.offsetZ - m.mesh.position.z) * 0.25;

          if (m.mesh.scale.x < 1.0) m.mesh.scale.addScalar(0.1);
          m.legL.rotation.x = walkCycle * 0.6;
          m.legR.rotation.x = -walkCycle * 0.6;
          m.mesh.position.y = Math.abs(walkCycle) * 0.08;
        });

        // 射撃
        shootTimer -= delta;
        const cooldown = isFeverTime ? 0.08 : 0.16;
        if (shootTimer <= 0) {
          shootTimer = cooldown;
          playSfx('shoot');

          squadMembers.forEach((m) => {
            const pos = m.mesh.position;
            const geo = isFeverTime ? new THREE.SphereGeometry(0.3, 6, 6) : new THREE.SphereGeometry(0.18, 5, 5);
            const color = isFeverTime ? 0xf43f5e : 0x38bdf8;
            const b = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
            b.position.set(pos.x, 0.6, pos.z - 0.4);
            scene.add(b);

            bullets.push({
              mesh: b,
              vz: isFeverTime ? -0.7 : -0.55,
              vx: (Math.random() - 0.5) * 0.03,
              isFever: isFeverTime
            });
          });
        }

        // スポーン制御
        gateTimer -= delta;
        if (gateTimer <= 0 && gates.length === 0 && !bossSpawned) {
          spawnGateSet();
          gateTimer = 8.5;
        }

        barrelTimer -= delta;
        if (barrelTimer <= 0 && barrels.length === 0 && !bossSpawned) {
          spawnBarrel();
          barrelTimer = 10.0;
        }

        spawnTimer -= delta;
        if (spawnTimer <= 0 && !bossSpawned) {
          const laneW = (BRIDGE_WIDTH - 2) / 3;
          const types = ['normal', 'normal', 'fast', 'heavy', 'bomber'];
          const type = types[Math.floor(Math.random() * types.length)];
          const x = (Math.floor(Math.random() * 3) - 1) * laneW;

          const eMesh = createEnemyMesh(type);
          eMesh.position.set(x, 0, -65);
          scene.add(eMesh);

          let hp = 3; let speed = 0.09;
          if (type === 'fast') { hp = 2; speed = 0.18; }
          if (type === 'heavy') { hp = 10; speed = 0.045; }
          if (type === 'bomber') { hp = 1; speed = 0.22; }

          enemies.push({ mesh: eMesh, hp, speed, type });
          spawnTimer = Math.max(0.5, 1.2 - gameTime * 0.015);
        }

        // ボス出現
        if (!bossSpawned && (gameTime > 42 || score >= 350)) {
          bossSpawned = true;
          const bMesh = createBossMesh();
          bMesh.position.set(0, 0, -75);
          scene.add(bMesh);
          boss = { mesh: bMesh, hp: 140, maxHp: 140, speed: 0.032 };
          document.getElementById('boss-hud').style.display = 'flex';
          shakeIntensity = 0.6;
        }

        // --- 1. 弾の移動と判定 ---
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.mesh.position.z += b.vz;
          b.mesh.position.x += b.vx;

          if (b.mesh.position.z < -80) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            continue;
          }

          let bulletConsumed = false;

          // A. ゲート育成＆破壊判定（新ギミック！）
          for (let g of gates) {
            if (Math.abs(b.mesh.position.z - g.mesh.position.z) < 0.6 &&
                Math.abs(b.mesh.position.x - g.mesh.position.x) < g.width / 2) {
              bulletConsumed = true;
              if (g.isPositive) {
                // 青ゲート：撃つと数字が育つ！
                g.val = Math.min(30, g.val + 1);
                updateGateTexture(g);
                playSfx('gate_grow');
                spawnParticles(b.mesh.position.x, 1.4, b.mesh.position.z, 0x38bdf8, 3, true);
              } else {
                // 赤ゲート：撃つとマイナスが削れる！
                g.val = Math.min(0, g.val + 1);
                updateGateTexture(g);
                spawnParticles(b.mesh.position.x, 1.4, b.mesh.position.z, 0xf87171, 3, true);
                if (g.val >= 0) {
                  // 赤ゲート完全破壊！
                  spawnParticles(g.mesh.position.x, 1.4, g.mesh.position.z, 0xfacc15, 20);
                  playSfx('barrel_boom');
                  scene.remove(g.mesh);
                  gates.splice(gates.indexOf(g), 1);
                }
              }
              break;
            }
          }

          // B. ドラム缶ヒット判定
          if (!bulletConsumed) {
            for (let k = barrels.length - 1; k >= 0; k--) {
              const bar = barrels[k];
              if (b.mesh.position.distanceTo(bar.mesh.position) < 0.8) {
                bulletConsumed = true;
                bar.hp -= b.isFever ? 3 : 1;
                spawnParticles(b.mesh.position.x, 0.6, b.mesh.position.z, 0xfacc15, 4);

                if (bar.hp <= 0) {
                  // 大爆発！周囲の敵を一掃
                  playSfx('barrel_boom');
                  shakeIntensity = 0.8;
                  spawnParticles(bar.mesh.position.x, 0.8, bar.mesh.position.z, 0xff0044, 35);

                  // 爆風範囲（半径4m以内の敵を撃破）
                  for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                    const en = enemies[eIdx];
                    if (en.mesh.position.distanceTo(bar.mesh.position) < 4.0) {
                      spawnParticles(en.mesh.position.x, 0.6, en.mesh.position.z, 0xef4444, 10);
                      scene.remove(en.mesh);
                      enemies.splice(eIdx, 1);
                      score += 20;
                    }
                  }

                  scene.remove(bar.mesh);
                  barrels.splice(k, 1);
                }
                break;
              }
            }
          }

          // C. 敵ヒット判定
          if (!bulletConsumed) {
            for (let j = enemies.length - 1; j >= 0; j--) {
              const e = enemies[j];
              if (e.mesh.position.distanceTo(b.mesh.position) < 0.85) {
                e.hp -= b.isFever ? 3 : 1;
                spawnParticles(b.mesh.position.x, 0.6, b.mesh.position.z, 0xfacc15, 2);
                if (!b.isFever) bulletConsumed = true; // フィーバー弾は貫通！

                if (e.hp <= 0) {
                  spawnParticles(e.mesh.position.x, 0.6, e.mesh.position.z, 0xef4444, 10);
                  scene.remove(e.mesh);
                  enemies.splice(j, 1);

                  score += e.type === 'heavy' ? 30 : 10;
                  document.getElementById('score-badge').innerText = `SCORE: ${score}`;

                  // コンボ & フィーバーチャージ
                  triggerCombo();
                  if (!isFeverTime) {
                    feverGauge = Math.min(100, feverGauge + 7);
                    document.getElementById('fever-bar-fill').style.width = `${feverGauge}%`;
                    if (feverGauge >= 100) {
                      isFeverTime = true;
                      feverTimer = 5.0;
                      playSfx('fever_start');
                      shakeIntensity = 0.5;
                      document.getElementById('fever-label').innerText = "🔥 FEVER RUSH ACTIVATED! 🔥";
                      document.getElementById('fever-label').style.color = "#f43f5e";
                    }
                  }
                }
                break;
              }
            }
          }

          // D. ボスヒット判定
          if (!bulletConsumed && boss) {
            if (Math.abs(b.mesh.position.z - boss.mesh.position.z) < 1.6 &&
                Math.abs(b.mesh.position.x - boss.mesh.position.x) < 1.6) {
              boss.hp -= b.isFever ? 3 : 1;
              if (!b.isFever) bulletConsumed = true;
              spawnParticles(b.mesh.position.x, 2.2, b.mesh.position.z, 0xf59e0b, 3);

              const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
              document.getElementById('boss-bar-fill').style.width = `${pct}%`;

              if (boss.hp <= 0) {
                spawnParticles(boss.mesh.position.x, 2.5, boss.mesh.position.z, 0xef4444, 60);
                shakeIntensity = 1.0;
                playSfx('barrel_boom');
                scene.remove(boss.mesh);
                boss = null;
                score += 500;
                document.getElementById('score-badge').innerText = `SCORE: ${score}`;
                endGame(true);
                return;
              }
            }
          }

          if (bulletConsumed) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }

        // --- 2. ゲートの移動 & 通過判定 ---
        for (let i = gates.length - 1; i >= 0; i--) {
          const g = gates[i];
          g.mesh.position.z += 0.11;

          if (!g.applied && Math.abs(g.mesh.position.z - DEFENSE_Z) < 1.0) {
            const left = g.mesh.position.x - g.width / 2;
            const right = g.mesh.position.x + g.width / 2;

            if (playerLeaderX >= left && playerLeaderX <= right) {
              g.applied = true;
              shakeIntensity = 0.2;
              if (g.isPositive) {
                addSquad(g.val);
              } else {
                removeSquad(Math.abs(g.val));
              }
            }
          }

          if (g.mesh.position.z > DEFENSE_Z + 4) {
            scene.remove(g.mesh);
            gates.splice(i, 1);
          }
        }

        // ドラム缶移動
        for (let i = barrels.length - 1; i >= 0; i--) {
          const bar = barrels[i];
          bar.mesh.position.z += 0.08;
          if (bar.mesh.position.z > DEFENSE_Z + 2) {
            scene.remove(bar.mesh);
            barrels.splice(i, 1);
          }
        }

        // --- 3. 敵の移動 & 自爆・突破判定 ---
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.mesh.position.z += e.speed;

          // ボマーの点滅
          if (e.type === 'bomber') {
            e.mesh.position.y = Math.sin(gameTime * 30) * 0.1 + 0.1;
          }

          if (e.mesh.position.z >= DEFENSE_Z) {
            if (e.type === 'bomber') {
              // 自爆特攻！部隊を複数人道連れにする
              playSfx('barrel_boom');
              shakeIntensity = 0.7;
              spawnParticles(e.mesh.position.x, 0.6, e.mesh.position.z, 0xff0044, 25);
              removeSquad(4);
              scene.remove(e.mesh);
              enemies.splice(i, 1);
              if (squadMembers.length <= 0) {
                endGame(false);
                return;
              }
            } else {
              endGame(false);
              return;
            }
          }
        }

        // ボス移動
        if (boss) {
          boss.mesh.position.z += boss.speed;
          if (boss.mesh.position.z >= DEFENSE_Z - 1.2) {
            endGame(false);
            return;
          }
        }

        // パーティクル
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.mesh.position.x += p.vx;
          p.mesh.position.y += p.vy;
          p.mesh.position.z += p.vz;
          p.vy -= 0.012;
          p.life -= delta;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    function endGame(isClear) {
      isPlaying = false;
      const res = document.getElementById('result-screen');
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');

      if (isClear) {
        title.innerText = 'MISSION COMPLETE!';
        title.style.color = '#38bdf8';
        desc.innerHTML = `大部隊でタイタンメカを撃破！<br>防衛ラインの完全防衛に成功した！<br><br>最大コンボ: <b>${comboCount}</b><br>最終部隊規模: <b>${squadMembers.length}人</b><br>最終スコア: <b>${score}</b>`;
      } else {
        title.innerText = 'DEFENSE BREACHED';
        title.style.color = '#ef4444';
        desc.innerHTML = `防衛ラインを突破された...<br><br>最終スコア: <b>${score}</b>`;
      }

      res.style.display = 'flex';
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', startGame);
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
