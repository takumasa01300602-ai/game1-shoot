<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DEAD BRIDGE: ARMED & READY</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #38bdf8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Impact", sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* シネマティックビネット */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 60px rgba(15, 23, 42, 0.65), inset 0 0 130px rgba(0, 0, 0, 0.45);
      z-index: 5;
      transition: box-shadow 0.15s;
    }
    #vignette.hit {
      box-shadow: inset 0 0 100px rgba(220, 38, 38, 0.95), inset 0 0 200px rgba(185, 28, 28, 0.85);
    }

    /* HUD */
    .hud-top {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-badge {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.94) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-left: 4px solid #38bdf8;
      backdrop-filter: blur(14px);
      padding: 6px 14px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-badge.score-badge { border-left-color: #facc15; }
    #squad-val { font-size: 20px; color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
    #score-val { font-size: 20px; color: #facc15; text-shadow: 0 0 8px rgba(250, 204, 21, 0.5); }

    /* 特殊武器アクティブHUD */
    #weapon-hud {
      position: absolute;
      top: calc(env(safe-area-inset-top, 14px) + 52px);
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 20px;
      background: linear-gradient(90deg, rgba(234, 179, 8, 0.9), rgba(249, 115, 22, 0.9));
      border: 2px solid #ffffff;
      border-radius: 20px;
      color: #fff;
      font-weight: 900;
      font-size: 12px;
      letter-spacing: 1.5px;
      box-shadow: 0 0 25px rgba(249, 115, 22, 0.8);
      display: none;
      z-index: 15;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* ボスHUD */
    #boss-hud {
      position: absolute;
      top: calc(env(safe-area-inset-top, 14px) + 54px);
      left: 50%;
      transform: translateX(-50%);
      width: 84%;
      max-width: 360px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    #boss-label {
      font-size: 11px;
      font-weight: 900;
      color: #ef4444;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      animation: alertPulse 0.8s infinite alternate;
    }
    @keyframes alertPulse {
      from { opacity: 0.8; }
      to { opacity: 1; }
    }
    .bar-wrap {
      width: 100%;
      height: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid #ef4444;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    #boss-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f87171, #dc2626);
      transition: width 0.08s linear;
    }

    /* 空爆ボタン */
    #ult-btn {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 20px);
      right: 20px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle, #334155, #0f172a);
      border: 3px solid #64748b;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 1px;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      transition: all 0.2s;
      outline: none;
    }
    #ult-btn.ready {
      border-color: #ef4444;
      color: #fff;
      background: radial-gradient(circle, #b91c1c, #7f1d1d);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
      cursor: pointer;
    }

    /* ダメージレイヤー */
    #damage-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }
    .dmg-num {
      position: absolute;
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px #000, 0 0 8px rgba(0,0,0,0.9);
      pointer-events: none;
      transition: transform 0.5s ease-out, opacity 0.5s;
    }
    .dmg-num.crit {
      font-size: 24px;
      color: #facc15;
      text-shadow: 0 2px 6px #000, 0 0 12px #eab308;
    }

    /* 画面オーバーレイ */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.9) 0%, rgba(2, 6, 23, 0.98) 100%);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }
    .screen-title {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
    .screen-desc {
      font-size: 13px;
      color: #cbd5e1;
      max-width: 320px;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .btn-main {
      padding: 16px 46px;
      font-size: 18px;
      font-weight: 900;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff;
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5);
      cursor: pointer;
      outline: none;
      letter-spacing: 1px;
    }
    .btn-main:active { transform: scale(0.95); }

    /* ローディングバー */
    #loading-box {
      width: 240px;
      margin-top: 15px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #loading-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.2s;
    }

    #error-box {
      position: absolute;
      bottom: 8px; left: 8px; right: 8px;
      color: #ff4d4d; font-size: 10px; background: rgba(0,0,0,0.85);
      padding: 6px; border-radius: 4px; display: none; z-index: 100;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="vignette"></div>
    <div id="weapon-hud">🔥 GATLING OVERDRIVE (8s) 🔥</div>
    <div id="error-box"></div>
    <div id="damage-layer"></div>

    <div class="hud-top">
      <div class="hud-badge">
        <span>SQUAD:</span>
        <span id="squad-val">1</span>
        <span style="font-size: 11px; color: #94a3b8;">/15</span>
      </div>
      <div class="hud-badge score-badge">
        <span>KILLS:</span>
        <span id="score-val">0</span>
      </div>
    </div>

    <!-- ボスHUD -->
    <div id="boss-hud">
      <div id="boss-label">⚠ TARGET: MUTANT GOLIATH ⚠</div>
      <div class="bar-wrap">
        <div id="boss-bar-fill"></div>
      </div>
    </div>

    <!-- 空爆ボタン -->
    <button id="ult-btn">
      <span>AIRSTRIKE</span>
      <span id="ult-pct">0%</span>
    </button>

    <!-- スタート画面 -->
    <div id="start-screen" class="screen-overlay">
      <h1 class="screen-title">DEAD BRIDGE: ARMED</h1>
      <p id="start-subtext" class="screen-desc">
        <b>【新兵装ドロップ投入】</b><br>
        流れてくる<b>黄金の武器クレート</b>を拾ってパワーアップ！<br>
        ガトリング超連射・3WAY散弾・榴弾RPGで大群を粉砕せよ。<br>
        左右移動でゾンビを狙い撃ち、防衛線を死守せよ！
      </p>

      <div id="loading-box">
        <div id="loading-text" style="color: #38bdf8; font-size: 11px; font-weight: 900; letter-spacing: 1px;">PREPARING WEAPONS... (0%)</div>
        <div class="progress-bar-bg">
          <div id="loading-fill"></div>
        </div>
      </div>

      <button id="start-btn" class="btn-main" style="display: none; margin-top: 15px;">START MISSION</button>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen-overlay" style="display: none;">
      <h1 id="result-title" class="screen-title">MISSION COMPLETE</h1>
      <p id="result-desc" class="screen-desc"></p>
      <button id="retry-btn" class="btn-main">REDEPLOY</button>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      const el = document.getElementById('error-box');
      el.style.display = 'block';
      el.innerText = `Line ${line}: ${msg}`;
    };

    // --- Web Audio リアル音響 ---
    let audioCtx = null;
    let bgmStep = 0;
    let bgmTimer = 0;

    function initAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {}
    }

    function stepBgm() {
      if (!audioCtx || !isPlaying) return;
      try {
        const now = audioCtx.currentTime;

        const bufferSize = audioCtx.sampleRate * 0.05;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.setValueAtTime(1400, now);

        const gain = audioCtx.createGain();
        const isStrong = (bgmStep % 4 === 0) || (bgmStep % 4 === 2);
        gain.gain.setValueAtTime(isStrong ? 0.08 : 0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);

        if (bgmStep % 4 === 0) {
          const kOsc = audioCtx.createOscillator();
          const kGain = audioCtx.createGain();
          kOsc.frequency.setValueAtTime(120, now);
          kOsc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
          kGain.gain.setValueAtTime(0.14, now);
          kGain.gain.linearRampToValueAtTime(0.001, now + 0.1);
          kOsc.connect(kGain);
          kGain.connect(audioCtx.destination);
          kOsc.start(now);
          kOsc.stop(now + 0.1);
        }
        bgmStep++;
      } catch (e) {}
    }

    function playSfx(type) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        if (type === 'rifle') {
          const bufferSize = audioCtx.sampleRate * 0.07;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

          const osc = audioCtx.createOscillator();
          const oGain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
          oGain.gain.setValueAtTime(0.14, now);
          oGain.gain.linearRampToValueAtTime(0.001, now + 0.05);

          noise.connect(gain);
          gain.connect(audioCtx.destination);
          osc.connect(oGain);
          oGain.connect(audioCtx.destination);
          noise.start(now);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'splat') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.07);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'pickup') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.setValueAtTime(880, now + 0.1);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'explosion') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.45);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'airstrike') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(550, now + 0.3);
          osc.frequency.linearRampToValueAtTime(70, now + 1.2);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        }
      } catch (e) {}
    }

    // --- ゲーム設定 ---
    const BRIDGE_WIDTH = 9.6;
    const DEFENSE_Z = 13.0;
    const MAX_SQUAD = 15;
    let isPlaying = false;
    let score = 0;
    let gameTime = 0;
    let spawnTimer = 0;
    let gateTimer = 0;
    let weaponDropTimer = 6.0; // 武器ドロップの定期出現タイマー
    let shakeIntensity = 0;

    // パワーアップ武器状態
    let currentWeapon = 'normal'; // 'normal', 'gatling', 'spread', 'rpg'
    let weaponTimer = 0;

    let ultGauge = 0;
    let isUltReady = false;

    // Three.js
    let scene, camera, renderer;
    let sunLight, muzzleLight;
    let playerLeaderX = 0;
    let targetX = 0;
    let roadMatRef, waterMatRef;

    let squadMembers = [];
    let bullets = [];
    let zombies = [];
    let gates = [];
    let weaponCrates = []; // 流れてくる武器コンテナ
    let particles = [];
    let shellCasings = [];
    let muzzleFlashes = [];
    let boss = null;

    let baseSoldierModel = null;
    let soldierAnimations = [];
    let hasLoadedAsset = false;

    // --- 高精細テクスチャ生成 ---
    function createRoadTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 1024; cvs.height = 1024;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#1c1f24';
      ctx.fillRect(0, 0, 1024, 1024);

      for (let i = 0; i < 9000; i++) {
        ctx.fillStyle = Math.random() < 0.5 ? '#15171b' : '#282c34';
        ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 3, 3);
      }

      ctx.fillStyle = 'rgba(10, 10, 12, 0.4)';
      for (let i = 0; i < 8; i++) {
        const tx = 200 + Math.random() * 624;
        ctx.fillRect(tx, Math.random() * 800, 36, 120 + Math.random() * 80);
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(24, 0, 16, 1024);
      ctx.fillRect(984, 0, 16, 1024);

      ctx.fillStyle = '#f59e0b';
      for (let y = 20; y < 1024; y += 140) {
        ctx.fillRect(504, y, 10, 80);
        ctx.fillRect(520, y, 10, 80);
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 16);
      return tex;
    }

    function createWaterTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 512; cvs.height = 512;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 240; i++) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        const w = 30 + Math.random() * 70;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, w, 5);
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 32);
      return tex;
    }

    function createMilGateTexture(label, isPos) {
      const cvs = document.createElement('canvas');
      cvs.width = 256; cvs.height = 256;
      const ctx = cvs.getContext('2d');

      ctx.fillStyle = isPos ? 'rgba(30, 58, 138, 0.88)' : 'rgba(127, 29, 29, 0.88)';
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = isPos ? '#38bdf8' : '#f87171';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, 242, 242);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 24px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isPos ? 'REINFORCE' : 'AMBUSH', 128, 50);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 84px Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 128, 140);
      return new THREE.CanvasTexture(cvs);
    }

    function createTracerTexture(isAmp = false) {
      const cvs = document.createElement('canvas');
      cvs.width = 64; cvs.height = 256;
      const ctx = cvs.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 256);
      if (isAmp) {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.2, '#38bdf8');
        grad.addColorStop(0.6, '#0284c7');
        grad.addColorStop(1.0, 'rgba(2, 132, 199, 0)');
      } else {
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.2, '#fef08a');
        grad.addColorStop(0.6, '#f97316');
        grad.addColorStop(1.0, 'rgba(239, 68, 68, 0)');
      }

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 256);
      return new THREE.CanvasTexture(cvs);
    }

    // --- 武器クレートモデル（黄金の補給コンテナ） ---
    function createWeaponCrate(type, x, z) {
      const g = new THREE.Group();
      const boxGeo = new THREE.BoxGeometry(1.2, 0.8, 0.8);
      const boxMat = new THREE.MeshStandardMaterial({
        color: 0xfacc15,
        metalness: 0.85,
        roughness: 0.2,
        emissive: 0xb45309,
        emissiveIntensity: 0.4
      });
      const box = new THREE.Mesh(boxGeo, boxMat);
      box.position.y = 0.5;
      box.castShadow = true;
      g.add(box);

      // 上部に浮かぶネオンアイコン
      const iconGeo = new THREE.SphereGeometry(0.25, 8, 8);
      let iconColor = 0xf59e0b;
      if (type === 'gatling') iconColor = 0x38bdf8;
      if (type === 'spread') iconColor = 0x22c55e;
      if (type === 'rpg') iconColor = 0xef4444;

      const icon = new THREE.Mesh(iconGeo, new THREE.MeshBasicMaterial({ color: iconColor }));
      icon.position.y = 1.3;
      g.add(icon);

      g.position.set(x, 0, z);
      scene.add(g);

      return { mesh: g, type, box };
    }

    // --- 特殊部隊装備 ---
    function createSpecialForcesRifle() {
      const gun = new THREE.Group();
      const gunMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.3, metalness: 0.85 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.65), gunMat);
      const suppressor = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.3, 8), gunMat);
      suppressor.rotation.x = Math.PI / 2;
      suppressor.position.set(0, 0.02, -0.45);
      const mag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.1), gunMat);
      mag.position.set(0, -0.12, -0.05);
      gun.add(body, suppressor, mag);
      gun.position.set(0.18, 1.02, -0.42);
      gun.castShadow = true;
      return gun;
    }

    function createGPNVG18() {
      const nvg = new THREE.Group();
      const mountMat = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.5 });
      const lensMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
      const base = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.06, 0.08), mountMat);
      for (let i = -1.5; i <= 1.5; i += 1.0) {
        const lens = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.035, 0.1, 8), lensMat);
        lens.rotation.x = Math.PI / 2;
        lens.position.set(i * 0.08, 0, -0.06);
        nvg.add(lens);
      }
      nvg.add(base);
      nvg.position.set(0, 1.55, -0.22);
      return nvg;
    }

    function createZombieFaceGore(type = 'normal') {
      const gore = new THREE.Group();
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0022 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), eyeMat);
      eyeL.position.set(-0.08, 1.48, 0.22);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.08;

      if (type === 'tank') {
        const tumorMat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.5 });
        const tumor = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), tumorMat);
        tumor.position.set(0.2, 1.3, -0.1);
        gore.add(tumor);
      }

      gore.add(eyeL, eyeR);
      return gore;
    }

    function extractBones(model) {
      const bones = {};
      model.traverse(child => {
        if (child.isBone) {
          const name = child.name;
          if (name.includes('RightArm')) bones.rightArm = child;
          if (name.includes('LeftArm')) bones.leftArm = child;
          if (name.includes('Spine')) bones.spine = child;
        }
      });
      return bones;
    }

    // --- キャラクター生成 ---
    function spawnSpecialForcesInstance(isLeader = false) {
      const model = THREE.SkeletonUtils.clone(baseSoldierModel);
      model.scale.set(1.15, 1.15, 1.15);

      const mixer = new THREE.AnimationMixer(model);
      const action = mixer.clipAction(soldierAnimations[0]);
      action.play();

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.material = child.material.clone();
          child.material.color.setHex(isLeader ? 0x1e3a8a : 0x334155);
          child.material.roughness = 0.7;
        }
      });

      const rifle = createSpecialForcesRifle();
      const nvg = createGPNVG18();
      model.add(rifle, nvg);

      const bones = extractBones(model);
      return { model, mixer, bones, rifle };
    }

    function spawnZombieInstance(type = 'normal') {
      const model = THREE.SkeletonUtils.clone(baseSoldierModel);
      let scale = 1.15;
      if (type === 'runner') scale = 0.95;
      if (type === 'tank') scale = 1.85;

      model.scale.set(scale, scale, scale);

      const mixer = new THREE.AnimationMixer(model);
      let clip = soldierAnimations[3] || soldierAnimations[0];
      let animSpeed = 1.0;

      if (type === 'runner') {
        clip = soldierAnimations[1];
        animSpeed = 1.85;
      }
      const action = mixer.clipAction(clip);
      action.timeScale = animSpeed;
      action.play();

      const mats = [];
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.material = child.material.clone();

          if (type === 'runner') child.material.color.setHex(0x991b1b);
          else if (type === 'tank') child.material.color.setHex(0x18181b);
          else child.material.color.setHex(0x3f5545);

          child.material.roughness = 0.9;
          mats.push(child.material);
        }
      });

      const faceGore = createZombieFaceGore(type);
      model.add(faceGore);
      model.rotation.y = Math.PI;

      const bones = extractBones(model);
      return { model, mixer, bones, mats, scale };
    }

    function spawnGoliathBossInstance() {
      const model = THREE.SkeletonUtils.clone(baseSoldierModel);
      const scale = 3.6;
      model.scale.set(scale, scale, scale);

      const mixer = new THREE.AnimationMixer(model);
      const clip = soldierAnimations[3] || soldierAnimations[0];
      const action = mixer.clipAction(clip);
      action.timeScale = 0.65;
      action.play();

      const mats = [];
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.material = child.material.clone();
          child.material.color.setHex(0x310a0a);
          child.material.roughness = 0.9;
          mats.push(child.material);
        }
      });

      const core = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff0044 }));
      core.position.set(0, 1.25, 0.2);
      model.add(core);

      model.rotation.y = Math.PI;
      const bones = extractBones(model);
      return { model, mixer, bones, mats, core };
    }

    // --- 初期セットアップ ---
    let tracerTextureNormal = null;
    let tracerTextureAmp = null;

    function init() {
      const container = document.getElementById('game-container');
      const w = container.clientWidth;
      const h = container.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.FogExp2(0xbae6fd, 0.007);

      camera = new THREE.PerspectiveCamera(52, w / h, 0.1, 300);
      camera.position.set(0, 16, 24);
      camera.lookAt(0, 1, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      container.appendChild(renderer.domElement);

      tracerTextureNormal = createTracerTexture(false);
      tracerTextureAmp = createTracerTexture(true);

      const hemiLight = new THREE.HemisphereLight(0xbae6fd, 0x0284c7, 0.75);
      scene.add(hemiLight);

      sunLight = new THREE.DirectionalLight(0xfffbeb, 1.45);
      sunLight.position.set(18, 38, 15);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 0.5;
      sunLight.shadow.camera.far = 160;
      sunLight.shadow.camera.left = -16;
      sunLight.shadow.camera.right = 16;
      sunLight.shadow.camera.top = 25;
      sunLight.shadow.camera.bottom = -45;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      muzzleLight = new THREE.PointLight(0xfef08a, 0, 10, 2);
      muzzleLight.position.set(0, 1.5, DEFENSE_Z);
      scene.add(muzzleLight);

      waterMatRef = createWaterTexture();
      const seaMat = new THREE.MeshStandardMaterial({
        map: waterMatRef,
        roughness: 0.18,
        metalness: 0.8,
        color: 0x0284c7
      });
      const sea = new THREE.Mesh(new THREE.PlaneGeometry(300, 400), seaMat);
      sea.rotation.x = -Math.PI / 2;
      sea.position.set(0, -18, -40);
      sea.receiveShadow = true;
      scene.add(sea);

      roadMatRef = createRoadTexture();
      const roadMat = new THREE.MeshStandardMaterial({
        map: roadMatRef,
        roughness: 0.82,
        metalness: 0.1
      });
      const road = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE_WIDTH, 1.0, 130), roadMat);
      road.position.set(0, -0.5, -35);
      road.receiveShadow = true;
      scene.add(road);

      const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.4, metalness: 0.7 });
      const railL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 130), railMat);
      railL.position.set(-BRIDGE_WIDTH / 2, 0.35, -35);
      railL.castShadow = true; railL.receiveShadow = true;
      const railR = railL.clone();
      railR.position.x = BRIDGE_WIDTH / 2;
      scene.add(railL, railR);

      // 防衛境界ライン
      const defLine = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_WIDTH, 0.08, 0.4),
        new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.4 })
      );
      defLine.position.set(0, 0.05, DEFENSE_Z);
      scene.add(defLine);

      setupTouchControls();
      setupUltButton();

      window.addEventListener('resize', onResize);
      loadAssets();
    }

    function loadAssets() {
      let completed = false;
      const onReady = () => {
        if (completed) return;
        completed = true;
        document.getElementById('loading-box').style.display = 'none';
        document.getElementById('start-btn').style.display = 'block';
        animate();
      };

      const timer = setTimeout(() => { onReady(); }, 3500);
      const loader = new THREE.GLTFLoader();
      loader.load(
        'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Soldier.glb',
        (gltf) => {
          clearTimeout(timer);
          baseSoldierModel = gltf.scene;
          soldierAnimations = gltf.animations;
          hasLoadedAsset = true;
          onReady();
        },
        (xhr) => {
          if (xhr.total > 0) {
            const pct = Math.floor((xhr.loaded / xhr.total) * 100);
            document.getElementById('loading-fill').style.width = `${pct}%`;
          }
        },
        () => { clearTimeout(timer); onReady(); }
      );
    }

    // --- 入力制御（左右ドラッグ操作） ---
    function setupTouchControls() {
      let startX = 0;
      let initX = 0;

      const onStart = (cx) => {
        startX = cx;
        initX = targetX;
      };
      const onMove = (cx) => {
        if (!isPlaying) return;
        const dx = (cx - startX) * 0.026;
        const maxR = BRIDGE_WIDTH / 2 - 0.7;
        targetX = Math.max(-maxR, Math.min(maxR, initX + dx));
      };

      window.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
      window.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
      window.addEventListener('mousedown', (e) => onStart(e.clientX));
      window.addEventListener('mousemove', (e) => onMove(e.clientX));
    }

    function setupUltButton() {
      const btn = document.getElementById('ult-btn');
      btn.addEventListener('click', triggerAirstrike);
      btn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        triggerAirstrike();
      });
    }

    function onResize() {
      const c = document.getElementById('game-container');
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(c.clientWidth, c.clientHeight);
    }

    // --- 部隊編成（密集デルタ隊形） ---
    function updateSquadLayout() {
      document.getElementById('squad-val').innerText = squadMembers.length;
      squadMembers.forEach((m, idx) => {
        if (idx === 0) { m.offsetX = 0; m.offsetZ = 0; return; }
        const row = Math.floor((idx + 1) / 2);
        const side = idx % 2 === 1 ? -1 : 1;
        m.offsetX = side * (row * 0.32);
        m.offsetZ = row * 0.75;
      });
    }

    function addSquad(cnt) {
      playSfx('rifle');
      const cur = squadMembers.length;
      const target = Math.min(MAX_SQUAD, cur + cnt);
      for (let i = cur; i < target; i++) {
        const u = spawnSpecialForcesInstance(false);
        u.model.position.set(playerLeaderX, 0, DEFENSE_Z);
        scene.add(u.model);
        squadMembers.push({
          mesh: u.model,
          mixer: u.mixer,
          bones: u.bones,
          recoil: 0,
          offsetX: 0,
          offsetZ: 0
        });
      }
      updateSquadLayout();
    }

    function removeSquad(cnt) {
      playSfx('splat');
      shakeIntensity = 0.6;

      const vig = document.getElementById('vignette');
      vig.classList.add('hit');
      setTimeout(() => vig.classList.remove('hit'), 180);

      const actualRemove = Math.min(cnt, squadMembers.length);
      for (let i = 0; i < actualRemove; i++) {
        if (squadMembers.length > 0) {
          const m = squadMembers.pop();
          spawnMeatDebris(m.mesh.position.x, 0.6, m.mesh.position.z, 0xef4444, 12);
          scene.remove(m.mesh);
        }
      }
      updateSquadLayout();

      if (squadMembers.length <= 0) {
        endGame(false);
      }
    }

    // --- ゲート管理 ---
    function spawnGatePair() {
      const z = -50;
      const w = BRIDGE_WIDTH / 2 - 0.35;
      const leftGood = Math.random() < 0.5;

      const g1 = createMilGate(leftGood ? 2 : -3, leftGood, -w / 2 - 0.15, z, w);
      const g2 = createMilGate(!leftGood ? 2 : -3, !leftGood, w / 2 + 0.15, z, w);
      gates.push(g1, g2);
    }

    function createMilGate(val, isPos, x, z, width) {
      const g = new THREE.Group();
      const panel = new THREE.Mesh(
        new THREE.PlaneGeometry(width, 2.8),
        new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.85, side: THREE.DoubleSide })
      );
      panel.position.y = 1.5;
      g.add(panel);

      const frameMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
      const pL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.2, 0.3), frameMat);
      pL.position.set(-width / 2, 1.5, 0);
      const pR = pL.clone(); pR.position.x = width / 2;
      g.add(pL, pR);

      g.position.set(x, 0, z);
      scene.add(g);

      const obj = { mesh: g, panel, val, isPos, width, applied: false, shootHits: 0 };
      updateGateTexture(obj);
      return obj;
    }

    function updateGateTexture(g) {
      const txt = g.isPos ? `+${g.val}` : `${g.val}`;
      g.panel.material.map = createMilGateTexture(txt, g.isPos);
      g.panel.material.needsUpdate = true;
    }

    // --- 武器パワーアップ発動 ---
    function activateWeapon(type) {
      currentWeapon = type;
      weaponTimer = 8.5; // 8.5秒間持続
      playSfx('pickup');

      const hud = document.getElementById('weapon-hud');
      hud.style.display = 'block';

      if (type === 'gatling') hud.innerText = '🔥 GATLING OVERDRIVE (8s) 🔥';
      else if (type === 'spread') hud.innerText = '⚡ 3-WAY SPREAD SHOT (8s) ⚡';
      else if (type === 'rpg') hud.innerText = '💥 EXPLOSIVE RPG ROUNDS (8s) 💥';
    }

    function showDamageNumber(val, x, y, z, isCrit = false) {
      const vector = new THREE.Vector3(x, y, z);
      vector.project(camera);

      const sx = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-(vector.y * 0.5) + 0.5) * window.innerHeight;

      const div = document.createElement('div');
      div.className = `dmg-num ${isCrit ? 'crit' : ''}`;
      div.innerText = isCrit ? `CRIT ${val}!` : `${val}`;
      div.style.left = `${sx}px`;
      div.style.top = `${sy}px`;
      document.getElementById('damage-layer').appendChild(div);

      gsap.to(div, {
        y: sy - 35,
        opacity: 0,
        duration: 0.45,
        ease: 'power2.out',
        onComplete: () => div.remove()
      });
    }

    function triggerAirstrike() {
      if (!isUltReady || !isPlaying) return;
      isUltReady = false;
      ultGauge = 0;
      updateUltUi();

      playSfx('airstrike');
      shakeIntensity = 1.4;

      for (let k = 0; k < 5; k++) {
        setTimeout(() => {
          if (!isPlaying) return;
          const boomZ = -5 - k * 8;
          const boomX = (Math.random() - 0.5) * (BRIDGE_WIDTH - 2);

          playSfx('explosion');
          shakeIntensity = 0.9;
          spawnExplosionSmoke(boomX, 0.5, boomZ, 30);

          for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];
            if (Math.abs(z.mesh.position.z - boomZ) < 6.0) {
              z.hp -= 30;
              showDamageNumber(30, z.mesh.position.x, 1, z.mesh.position.z, true);
              if (z.hp <= 0) {
                spawnMeatDebris(z.mesh.position.x, 0.7, z.mesh.position.z, 0xef4444, 15);
                scene.remove(z.mesh);
                zombies.splice(i, 1);
                score++;
                document.getElementById('score-val').innerText = score;
              }
            }
          }

          if (boss && Math.abs(boss.mesh.position.z - boomZ) < 7.0) {
            boss.hp -= 35;
            showDamageNumber(35, boss.mesh.position.x, 2.5, boss.mesh.position.z, true);
            updateBossHp();
          }
        }, k * 110);
      }
    }

    function chargeUlt(amt) {
      if (isUltReady) return;
      ultGauge = Math.min(100, ultGauge + amt);
      if (ultGauge >= 100) isUltReady = true;
      updateUltUi();
    }

    function updateUltUi() {
      const btn = document.getElementById('ult-btn');
      const pct = document.getElementById('ult-pct');
      pct.innerText = `${Math.floor(ultGauge)}%`;
      if (isUltReady) btn.classList.add('ready');
      else btn.classList.remove('ready');
    }

    // --- スタート / リセット ---
    function startGame() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';

      squadMembers.forEach(m => scene.remove(m.mesh));
      bullets.forEach(b => scene.remove(b.mesh));
      zombies.forEach(z => scene.remove(z.mesh));
      gates.forEach(g => scene.remove(g.mesh));
      weaponCrates.forEach(c => scene.remove(c.mesh));
      particles.forEach(p => scene.remove(p.mesh));
      shellCasings.forEach(sc => scene.remove(sc.mesh));
      muzzleFlashes.forEach(mf => scene.remove(mf.mesh));
      if (boss) scene.remove(boss.mesh);

      squadMembers = [];
      bullets = [];
      zombies = [];
      gates = [];
      weaponCrates = [];
      particles = [];
      shellCasings = [];
      muzzleFlashes = [];
      boss = null;

      score = 0;
      gameTime = 0;
      spawnTimer = 0;
      gateTimer = 1.0;
      weaponDropTimer = 5.0; // 開始5秒後に最初の武器ドロップ！
      currentWeapon = 'normal';
      weaponTimer = 0;
      shakeIntensity = 0;
      ultGauge = 0;
      isUltReady = false;
      playerLeaderX = 0;
      targetX = 0;

      const leader = spawnSpecialForcesInstance(true);
      leader.model.position.set(0, 0, DEFENSE_Z);
      scene.add(leader.model);
      squadMembers.push({
        mesh: leader.model,
        mixer: leader.mixer,
        bones: leader.bones,
        recoil: 0,
        offsetX: 0,
        offsetZ: 0
      });

      updateSquadLayout();
      updateUltUi();
      document.getElementById('score-val').innerText = '0';
      document.getElementById('boss-hud').style.display = 'none';
      document.getElementById('weapon-hud').style.display = 'none';

      isPlaying = true;
    }

    function spawnMuzzleFlash(x, y, z) {
      const size = 0.35 + Math.random() * 0.15;
      const geo = new THREE.PlaneGeometry(size, size);
      const mat = new THREE.MeshBasicMaterial({ color: 0xfef08a, transparent: true, opacity: 0.95, side: THREE.DoubleSide });
      const flash = new THREE.Mesh(geo, mat);
      flash.position.set(x, y, z);
      flash.rotation.z = Math.random() * Math.PI;
      scene.add(flash);
      muzzleFlashes.push({ mesh: flash, life: 0.05 });
    }

    function spawnCasing(x, y, z) {
      const casing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.035, 0.035, 0.14, 6),
        new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.95, roughness: 0.2 })
      );
      casing.rotation.z = Math.PI / 2;
      casing.position.set(x, y, z);
      scene.add(casing);

      shellCasings.push({
        mesh: casing,
        vx: 0.12 + Math.random() * 0.06,
        vy: 0.16 + Math.random() * 0.08,
        vz: 0.05 + Math.random() * 0.05,
        life: 0.4
      });
    }

    function spawnMeatDebris(x, y, z, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.08 + Math.random() * 0.06, 6, 6),
          new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
        );
        p.position.set(x, y, z);
        p.castShadow = true;
        scene.add(p);
        particles.push({
          mesh: p,
          vx: (Math.random() - 0.5) * 0.38,
          vy: Math.random() * 0.35 + 0.12,
          vz: (Math.random() - 0.5) * 0.38,
          life: 0.5
        });
      }
    }

    function spawnExplosionSmoke(x, y, z, count = 25) {
      for (let i = 0; i < count; i++) {
        const isFire = Math.random() < 0.4;
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.35 + Math.random() * 0.3, 6, 6),
          new THREE.MeshStandardMaterial({ color: 0xf97316, roughness: 0.9 })
        );
        p.position.set(x, y, z);
        scene.add(p);
        particles.push({
          mesh: p,
          vx: (Math.random() - 0.5) * 0.45,
          vy: Math.random() * 0.5 + 0.18,
          vz: (Math.random() - 0.5) * 0.45,
          life: 0.7
        });
      }
    }

    function updateBossHp() {
      if (!boss) return;
      const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
      document.getElementById('boss-bar-fill').style.width = `${pct}%`;
    }

    // --- メインループ ---
    let shootCool = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = 0.016;

      if (isPlaying) {
        gameTime += delta;

        bgmTimer -= delta;
        if (bgmTimer <= 0) {
          stepBgm();
          bgmTimer = 0.13;
        }

        if (roadMatRef) roadMatRef.offset.y -= 0.012;
        if (waterMatRef) waterMatRef.offset.y -= 0.006;

        if (shakeIntensity > 0) {
          camera.position.x = (Math.random() - 0.5) * shakeIntensity;
          camera.position.y = 16 + (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity *= 0.88;
          if (shakeIntensity < 0.01) { shakeIntensity = 0; camera.position.set(0, 16, 24); }
        }

        if (muzzleLight.intensity > 0) muzzleLight.intensity -= 0.7;

        playerLeaderX += (targetX - playerLeaderX) * 0.24;

        // 特殊武器タイマー更新
        if (weaponTimer > 0) {
          weaponTimer -= delta;
          const hud = document.getElementById('weapon-hud');
          const sec = Math.ceil(weaponTimer);
          if (currentWeapon === 'gatling') hud.innerText = `🔥 GATLING OVERDRIVE (${sec}s) 🔥`;
          else if (currentWeapon === 'spread') hud.innerText = `⚡ 3-WAY SPREAD SHOT (${sec}s) ⚡`;
          else if (currentWeapon === 'rpg') hud.innerText = `💥 EXPLOSIVE RPG (${sec}s) 💥`;

          if (weaponTimer <= 0) {
            currentWeapon = 'normal';
            hud.style.display = 'none';
          }
        }

        // 兵士更新
        squadMembers.forEach(m => {
          if (m.recoil > 0) {
            m.recoil -= delta * 12;
            if (m.recoil < 0) m.recoil = 0;
          }

          const recoilZ = m.recoil * 0.14;
          const recoilRotX = -m.recoil * 0.08;

          m.mesh.position.x += (playerLeaderX + m.offsetX - m.mesh.position.x) * 0.28;
          m.mesh.position.z += (DEFENSE_Z + m.offsetZ + recoilZ - m.mesh.position.z) * 0.28;
          m.mesh.rotation.x = recoilRotX;

          if (m.mixer) m.mixer.update(delta);

          if (m.bones) {
            if (m.bones.rightArm) m.bones.rightArm.rotation.set(-1.25, 0.45, 0.2 + m.recoil * 0.15);
            if (m.bones.leftArm) m.bones.leftArm.rotation.set(-1.05, -0.55, -0.2);
          }
        });

        // 武器別フルオート射撃ロジック
        shootCool -= delta;
        const cooldown = (currentWeapon === 'gatling') ? 0.055 : (currentWeapon === 'rpg' ? 0.20 : 0.12);

        if (shootCool <= 0) {
          shootCool = cooldown;
          playSfx('rifle');

          muzzleLight.position.set(playerLeaderX, 1.2, DEFENSE_Z - 0.8);
          muzzleLight.intensity = (currentWeapon === 'gatling') ? 3.5 : 2.8;

          squadMembers.forEach(m => {
            m.recoil = 1.0;
            const muzzleX = m.mesh.position.x + 0.18;
            const muzzleY = 1.05;
            const muzzleZ = m.mesh.position.z - 0.85;

            spawnMuzzleFlash(muzzleX, muzzleY, muzzleZ);

            // 弾丸生成（通常 / ガトリング / 3WAY / RPG）
            if (currentWeapon === 'spread') {
              // 3WAY散弾
              [-0.12, 0, 0.12].forEach(vx => {
                const tracerGeo = new THREE.CylinderGeometry(0.035, 0.05, 1.4, 6);
                tracerGeo.rotateX(Math.PI / 2);
                const tracer = new THREE.Mesh(tracerGeo, new THREE.MeshBasicMaterial({ map: tracerTextureAmp, transparent: true }));
                tracer.position.set(muzzleX, muzzleY, muzzleZ - 0.7);
                scene.add(tracer);

                bullets.push({
                  mesh: tracer,
                  vz: -1.35,
                  vx: vx,
                  damage: 1.5,
                  penetration: 2,
                  isRpg: false,
                  prevZ: muzzleZ - 0.7,
                  passedGates: new Set()
                });
              });
            } else {
              // 通常・ガトリング・RPG
              const isRpg = (currentWeapon === 'rpg');
              const tracerGeo = new THREE.CylinderGeometry(isRpg ? 0.08 : 0.035, isRpg ? 0.09 : 0.05, isRpg ? 1.0 : 1.4, 6);
              tracerGeo.rotateX(Math.PI / 2);
              const tracer = new THREE.Mesh(tracerGeo, new THREE.MeshBasicMaterial({
                map: (currentWeapon === 'gatling') ? tracerTextureAmp : tracerTextureNormal,
                transparent: true
              }));
              tracer.position.set(muzzleX, muzzleY, muzzleZ - 0.7);
              scene.add(tracer);

              bullets.push({
                mesh: tracer,
                vz: isRpg ? -1.1 : -1.45,
                vx: (Math.random() - 0.5) * 0.015,
                damage: isRpg ? 6 : (currentWeapon === 'gatling' ? 1.4 : 1),
                penetration: isRpg ? 1 : (currentWeapon === 'gatling' ? 2 : 1),
                isRpg: isRpg,
                prevZ: muzzleZ - 0.7,
                passedGates: new Set()
              });
            }

            spawnCasing(muzzleX + 0.15, muzzleY, muzzleZ + 0.35);
          });
        }

        // マズルフラッシュ
        for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
          const mf = muzzleFlashes[i];
          mf.life -= delta;
          if (mf.life <= 0) {
            scene.remove(mf.mesh);
            muzzleFlashes.splice(i, 1);
          }
        }

        // ゲートスポーン
        gateTimer -= delta;
        if (gateTimer <= 0 && gates.length === 0 && !boss) {
          spawnGatePair();
          gateTimer = 8.5;
        }

        // --- 武器クレートスポーン（定期的に補給が流れてくる） ---
        weaponDropTimer -= delta;
        if (weaponDropTimer <= 0 && weaponCrates.length === 0) {
          weaponDropTimer = 13.0; // 約13秒ごとにドロップ
          const types = ['gatling', 'spread', 'rpg'];
          const selectedType = types[Math.floor(Math.random() * types.length)];
          const x = (Math.random() - 0.5) * (BRIDGE_WIDTH - 2.5);
          const crate = createWeaponCrate(selectedType, x, -52);
          weaponCrates.push(crate);
        }

        // 武器クレート移動＆取得判定
        for (let i = weaponCrates.length - 1; i >= 0; i--) {
          const c = weaponCrates[i];
          c.mesh.position.z += 0.11;
          c.mesh.rotation.y += 0.03; // クルクル回転して目立つ

          // 自機部隊との接触判定（GET!）
          if (Math.abs(c.mesh.position.z - DEFENSE_Z) < 1.4) {
            if (Math.abs(playerLeaderX - c.mesh.position.x) < 1.6) {
              activateWeapon(c.type);
              spawnMeatDebris(c.mesh.position.x, 0.8, c.mesh.position.z, 0xfacc15, 20);
              scene.remove(c.mesh);
              weaponCrates.splice(i, 1);
              continue;
            }
          }

          if (c.mesh.position.z > DEFENSE_Z + 4) {
            scene.remove(c.mesh);
            weaponCrates.splice(i, 1);
          }
        }

        // --- ゾンビ大群スポーン（手応えがありつつ押し返せる適正バランス） ---
        spawnTimer -= delta;
        if (spawnTimer <= 0) {
          // 後半も「多すぎず少なすぎず」の適正量（5〜8体同時）
          const baseCount = gameTime > 30 ? 5 : (gameTime > 18 ? 4 : 3);
          const count = baseCount + Math.floor(Math.random() * 4);

          for (let k = 0; k < count; k++) {
            const rand = Math.random();
            let type = 'normal';
            if (rand < 0.35) type = 'runner'; // 猛ダッシュ
            else if (rand < 0.55) type = 'tank'; // 肉壁タンク

            const x = (Math.random() - 0.5) * (BRIDGE_WIDTH - 1.5);
            const zOffset = -45 - Math.random() * 8;

            const zObj = spawnZombieInstance(type);
            zObj.model.position.set(x, 0, zOffset);
            scene.add(zObj.model);

            let hp = type === 'tank' ? 12 : (type === 'runner' ? 2 : 3);
            let spd = type === 'runner' ? 0.25 : (type === 'tank' ? 0.08 : 0.12);

            zombies.push({
              mesh: zObj.model,
              mixer: zObj.mixer,
              bones: zObj.bones,
              mats: zObj.mats,
              hp,
              type,
              speed: spd,
              wobbleSeed: Math.random() * 10
            });
          }

          // 最短0.4秒間隔で安定供給
          spawnTimer = Math.max(0.4, 0.95 - gameTime * 0.012);
        }

        // ボス出現（38秒経過または撃破数到達）
        if (!boss && (gameTime > 38 || score >= 85)) {
          const bObj = spawnGoliathBossInstance();
          bObj.model.position.set(0, 0, -55);
          scene.add(bObj.model);

          boss = {
            mesh: bObj.model,
            mixer: bObj.mixer,
            bones: bObj.bones,
            mats: bObj.mats,
            hp: 550,
            maxHp: 550,
            speed: 0.032
          };
          document.getElementById('boss-hud').style.display = 'flex';
          shakeIntensity = 1.0;
          playSfx('explosion');
        }

        // --- 1. 弾丸移動＆壁貫通＆ゾンビ着弾判定 ---
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          const oldZ = b.prevZ !== undefined ? b.prevZ : b.mesh.position.z;
          b.mesh.position.z += b.vz;
          b.mesh.position.x += b.vx;
          const newZ = b.mesh.position.z;
          b.prevZ = newZ;

          if (newZ < -80) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            continue;
          }

          // 壁の貫通判定
          for (let g of gates) {
            const gz = g.mesh.position.z;
            if (oldZ >= gz - 0.5 && newZ <= gz + 0.5) {
              if (Math.abs(b.mesh.position.x - g.mesh.position.x) < g.width / 2) {
                if (!b.passedGates.has(g)) {
                  b.passedGates.add(g);

                  if (g.isPos) {
                    g.shootHits++;
                    if (g.shootHits % 25 === 0 && g.val < 4) {
                      g.val++;
                      updateGateTexture(g);
                    }
                    b.damage *= 1.8;
                    b.penetration += 2;
                    b.mesh.material.map = tracerTextureAmp;
                  }
                }
              }
            }
          }

          // ゾンビ着弾判定
          let bulletRemoved = false;
          for (let j = zombies.length - 1; j >= 0; j--) {
            const z = zombies[j];
            const zx = z.mesh.position.x;
            const zz = z.mesh.position.z;
            const hitRadius = z.type === 'tank' ? 1.6 : 0.95;

            const inZRange = (oldZ >= zz - hitRadius) && (newZ <= zz + hitRadius);
            const inXRange = Math.abs(b.mesh.position.x - zx) <= hitRadius;

            if (inZRange && inXRange) {
              const isCrit = Math.random() < 0.2;
              let dmg = b.damage;
              if (isCrit) dmg *= 2;

              z.hp -= dmg;
              b.penetration--;

              chargeUlt(0.8);
              playSfx('splat');
              showDamageNumber(Math.floor(dmg), zx, 1.2, zz, isCrit || b.damage > 1.5);
              spawnMeatDebris(zx, 0.7, zz, 0x5a7d65, 3);

              // RPG榴弾爆発処理（周囲を巻き込む）
              if (b.isRpg) {
                playSfx('explosion');
                shakeIntensity = 0.6;
                spawnExplosionSmoke(zx, 0.7, zz, 20);
                for (let o = zombies.length - 1; o >= 0; o--) {
                  const oz = zombies[o];
                  if (oz !== z && oz.mesh.position.distanceTo(z.mesh.position) < 3.2) {
                    oz.hp -= 4;
                    if (oz.hp <= 0) {
                      spawnMeatDebris(oz.mesh.position.x, 0.7, oz.mesh.position.z, 0xef4444, 12);
                      scene.remove(oz.mesh);
                      zombies.splice(o, 1);
                      score++;
                    }
                  }
                }
              }

              if (z.mats && z.mats.length > 0) {
                z.mats.forEach(mat => mat.emissive && mat.emissive.setHex(0xffffff));
                setTimeout(() => { z.mats.forEach(mat => mat.emissive && mat.emissive.setHex(0x000000)); }, 50);
              }

              if (z.hp <= 0) {
                spawnMeatDebris(zx, 0.7, zz, 0xef4444, z.type === 'tank' ? 25 : 12);
                scene.remove(z.mesh);
                zombies.splice(j, 1);
                score++;
                document.getElementById('score-val').innerText = score;
              }

              if (b.penetration <= 0) {
                bulletRemoved = true;
                break;
              }
            }
          }

          // ボス着弾
          if (!bulletRemoved && boss) {
            const bx = boss.mesh.position.x;
            const bz = boss.mesh.position.z;
            if ((oldZ >= bz - 2.2) && (newZ <= bz + 2.2) && Math.abs(b.mesh.position.x - bx) <= 2.2) {
              boss.hp -= b.damage;
              b.penetration--;
              chargeUlt(0.6);
              playSfx('splat');
              showDamageNumber(Math.floor(b.damage), bx, 2.5, bz);
              updateBossHp();

              if (boss.hp <= 0) {
                spawnMeatDebris(bx, 3.0, bz, 0xef4444, 80);
                shakeIntensity = 1.4;
                playSfx('explosion');
                scene.remove(boss.mesh);
                boss = null;
                score += 100;
                document.getElementById('score-val').innerText = score;
                endGame(true);
                return;
              }

              if (b.penetration <= 0) bulletRemoved = true;
            }
          }

          if (bulletRemoved) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }

        // --- 2. ゾンビの移動＆防衛ライン判定 ---
        for (let i = zombies.length - 1; i >= 0; i--) {
          const z = zombies[i];
          z.mesh.position.z += z.speed;
          if (z.mixer) z.mixer.update(delta);

          // 防衛ライン突入
          if (z.mesh.position.z >= DEFENSE_Z) {
            spawnMeatDebris(z.mesh.position.x, 0.6, z.mesh.position.z, 0xef4444, 15);
            scene.remove(z.mesh);
            zombies.splice(i, 1);

            removeSquad(z.type === 'tank' ? 2 : 1);
            if (!isPlaying) return;
          }
        }

        // ボス防衛ライン到達
        if (boss) {
          boss.mesh.position.z += boss.speed;
          if (boss.mixer) boss.mixer.update(delta);

          if (boss.mesh.position.z >= DEFENSE_Z - 1.5) {
            endGame(false);
            return;
          }
        }

        // ゲート通過
        for (let i = gates.length - 1; i >= 0; i--) {
          const g = gates[i];
          g.mesh.position.z += 0.12;

          if (!g.applied && Math.abs(g.mesh.position.z - DEFENSE_Z) < 1.0) {
            const left = g.mesh.position.x - g.width / 2;
            const right = g.mesh.position.x + g.width / 2;
            if (playerLeaderX >= left && playerLeaderX <= right) {
              g.applied = true;
              shakeIntensity = 0.3;
              if (g.isPos) addSquad(g.val);
              else removeSquad(Math.abs(g.val));
            }
          }
          if (g.mesh.position.z > DEFENSE_Z + 4) {
            scene.remove(g.mesh);
            gates.splice(i, 1);
          }
        }

        // 薬莢物理
        for (let i = shellCasings.length - 1; i >= 0; i--) {
          const sc = shellCasings[i];
          sc.mesh.position.x += sc.vx;
          sc.mesh.position.y += sc.vy;
          sc.mesh.position.z += sc.vz;
          sc.vy -= 0.015;
          sc.life -= delta;
          if (sc.life <= 0) {
            scene.remove(sc.mesh);
            shellCasings.splice(i, 1);
          }
        }

        // パーティクル
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.mesh.position.x += p.vx;
          p.mesh.position.y += p.vy;
          p.mesh.position.z += p.vz;
          p.vy -= 0.012;
          p.life -= delta;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    function endGame(isClear) {
      isPlaying = false;
      const res = document.getElementById('result-screen');
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');

      if (isClear) {
        title.innerText = 'MISSION ACCOMPLISHED';
        title.style.color = '#22c55e';
        desc.innerHTML = `変異巨獣ゴライアスと大群を完全殲滅！<br>極限状況を生き延びた！<br><br>撃破数: <b>${score}体</b><br>残存戦力: <b>${squadMembers.length}名</b>`;
      } else {
        title.innerText = 'DEFENSE OVERRUN';
        title.style.color = '#ef4444';
        desc.innerHTML = `防衛線が突破され部隊が全滅した...<br><br>撃破数: <b>${score}体</b>`;
      }
      res.style.display = 'flex';
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', startGame);
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
