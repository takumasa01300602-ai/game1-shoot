<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Z-OUTBREAK: REVOLUTION</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #38bdf8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Impact", sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 映画的シネマティックビネット */
    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 70px rgba(15, 23, 42, 0.65), inset 0 0 140px rgba(0, 0, 0, 0.45);
      z-index: 5;
      transition: box-shadow 0.2s;
    }
    #vignette.hit {
      box-shadow: inset 0 0 90px rgba(220, 38, 38, 0.85), inset 0 0 180px rgba(185, 28, 28, 0.7);
    }

    /* ネイティブAAA級 HUD */
    .hud-top {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-badge {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.94) 0%, rgba(15, 23, 42, 0.98) 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-left: 4px solid #38bdf8;
      backdrop-filter: blur(14px);
      padding: 6px 14px;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-badge.score-badge { border-left-color: #facc15; }
    #squad-val { font-size: 20px; color: #38bdf8; text-shadow: 0 0 8px rgba(56, 189, 248, 0.5); }
    #score-val { font-size: 20px; color: #facc15; text-shadow: 0 0 8px rgba(250, 204, 21, 0.5); }

    /* ボスHUD */
    #boss-hud {
      position: absolute;
      top: calc(env(safe-area-inset-top, 14px) + 54px);
      left: 50%;
      transform: translateX(-50%);
      width: 84%;
      max-width: 360px;
      display: none;
      flex-direction: column;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }
    #boss-label {
      font-size: 11px;
      font-weight: 900;
      color: #ef4444;
      letter-spacing: 2px;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      animation: pulseAlert 0.8s infinite alternate;
    }
    @keyframes pulseAlert {
      from { transform: scale(1); opacity: 0.85; }
      to { transform: scale(1.05); opacity: 1; }
    }
    .boss-bar-wrap {
      width: 100%;
      height: 14px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #ef4444;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.4);
    }
    #boss-bar-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #f87171, #dc2626);
      transition: width 0.08s linear;
    }

    /* 空爆支援ボタン */
    #ult-btn {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 16px) + 20px);
      right: 20px;
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: radial-gradient(circle, #334155, #0f172a);
      border: 3px solid #64748b;
      color: #94a3b8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 10px;
      letter-spacing: 1px;
      z-index: 20;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      transition: all 0.2s;
      outline: none;
    }
    #ult-btn.ready {
      border-color: #ef4444;
      color: #fff;
      background: radial-gradient(circle, #b91c1c, #7f1d1d);
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.9);
      animation: pulseBtn 0.9s infinite alternate;
      cursor: pointer;
    }
    @keyframes pulseBtn {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
    #ult-btn:active.ready { transform: scale(0.92); }

    /* ダメージレイヤー */
    #damage-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      overflow: hidden;
    }
    .dmg-num {
      position: absolute;
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 4px #000, 0 0 8px rgba(0,0,0,0.9);
      pointer-events: none;
      transition: transform 0.6s cubic-bezier(0.1, 0.8, 0.2, 1), opacity 0.6s;
    }
    .dmg-num.crit {
      font-size: 24px;
      color: #facc15;
      text-shadow: 0 2px 6px #000, 0 0 12px #eab308;
    }

    /* 画面オーバーレイ */
    .screen-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(15, 23, 42, 0.9) 0%, rgba(2, 6, 23, 0.98) 100%);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      padding: 24px;
      text-align: center;
    }
    .screen-title {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 12px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
    }
    .screen-desc {
      font-size: 13px;
      color: #cbd5e1;
      max-width: 320px;
      line-height: 1.7;
      margin-bottom: 28px;
    }
    .btn-main {
      padding: 16px 46px;
      font-size: 18px;
      font-weight: 900;
      border: none;
      border-radius: 40px;
      background: linear-gradient(135deg, #15803d, #22c55e);
      color: #fff;
      box-shadow: 0 8px 25px rgba(34, 197, 94, 0.5);
      cursor: pointer;
      outline: none;
      letter-spacing: 1px;
    }
    .btn-main:active { transform: scale(0.95); }

    /* ローディングバー */
    #loading-box {
      width: 240px;
      margin-top: 15px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    #loading-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.2s;
    }

    #error-box {
      position: absolute;
      bottom: 8px; left: 8px; right: 8px;
      color: #ff4d4d; font-size: 10px; background: rgba(0,0,0,0.85);
      padding: 6px; border-radius: 4px; display: none; z-index: 100;
    }
  </style>

  <!-- Three.js + GLTFLoader + SkeletonUtils + GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
  <div id="game-container">
    <div id="vignette"></div>
    <div id="error-box"></div>
    <div id="damage-layer"></div>

    <div class="hud-top">
      <div class="hud-badge">
        <span>SQUAD:</span>
        <span id="squad-val">1</span>
      </div>
      <div class="hud-badge score-badge">
        <span>KILLS:</span>
        <span id="score-val">0</span>
      </div>
    </div>

    <!-- ボスHUD -->
    <div id="boss-hud">
      <div id="boss-label">⚠ TARGET: MUTANT GOLIATH ⚠</div>
      <div class="boss-bar-wrap">
        <div id="boss-bar-fill"></div>
      </div>
    </div>

    <!-- 空爆ボタン -->
    <button id="ult-btn">
      <span>AIRSTRIKE</span>
      <span id="ult-pct">0%</span>
    </button>

    <!-- スタート画面 ＆ アセットローディング -->
    <div id="start-screen" class="screen-overlay">
      <h1 class="screen-title">Z-OUTBREAK: REVOLUTION</h1>
      <p id="start-subtext" class="screen-desc">
        <b>【リアル3Dモデル・次世代サバイバー】</b><br>
        晴天の巨大ベイブリッジを埋め尽くす<b>ゾンビの大群</b>を撃滅せよ！<br>
        作戦ゲートを撃ち抜いて部隊を増殖させ、一斉掃射！
      </p>

      <div id="loading-box">
        <div id="loading-text" style="color: #38bdf8; font-size: 11px; font-weight: 900; letter-spacing: 1px;">DOWNLOADING 3D ASSETS... (0%)</div>
        <div class="progress-bar-bg">
          <div id="loading-fill"></div>
        </div>
      </div>

      <button id="start-btn" class="btn-main" style="display: none; margin-top: 15px;">COMMENCE ENGAGEMENT</button>
    </div>

    <!-- リザルト画面 -->
    <div id="result-screen" class="screen-overlay" style="display: none;">
      <h1 id="result-title" class="screen-title">SECTOR SECURED</h1>
      <p id="result-desc" class="screen-desc"></p>
      <button id="retry-btn" class="btn-main">REDEPLOY</button>
    </div>
  </div>

  <script>
    window.onerror = function(msg, url, line) {
      const el = document.getElementById('error-box');
      el.style.display = 'block';
      el.innerText = `Line ${line}: ${msg}`;
    };

    // --- Web Audio リアル音響 ---
    let audioCtx = null;
    let bgmStep = 0;
    let bgmTimer = 0;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function stepBgm() {
      if (!audioCtx || !isPlaying) return;
      const now = audioCtx.currentTime;

      const bufferSize = audioCtx.sampleRate * 0.05;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.setValueAtTime(1400, now);

      const gain = audioCtx.createGain();
      const isStrong = (bgmStep % 4 === 0) || (bgmStep % 4 === 2);
      gain.gain.setValueAtTime(isStrong ? 0.08 : 0.03, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      noise.start(now);

      if (bgmStep % 4 === 0) {
        const kOsc = audioCtx.createOscillator();
        const kGain = audioCtx.createGain();
        kOsc.frequency.setValueAtTime(120, now);
        kOsc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
        kGain.gain.setValueAtTime(0.14, now);
        kGain.gain.linearRampToValueAtTime(0.001, now + 0.1);
        kOsc.connect(kGain);
        kGain.connect(audioCtx.destination);
        kOsc.start(now);
        kOsc.stop(now + 0.1);
      }
      bgmStep++;
    }

    function playSfx(type) {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        if (type === 'rifle') {
          const bufferSize = audioCtx.sampleRate * 0.07;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.13, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

          const osc = audioCtx.createOscillator();
          const oGain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(180, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.05);
          oGain.gain.setValueAtTime(0.14, now);
          oGain.gain.linearRampToValueAtTime(0.001, now + 0.05);

          noise.connect(gain);
          gain.connect(audioCtx.destination);
          osc.connect(oGain);
          oGain.connect(audioCtx.destination);
          noise.start(now);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'splat') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(30, now + 0.07);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.07);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.07);
        } else if (type === 'explosion') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(110, now);
          osc.frequency.exponentialRampToValueAtTime(20, now + 0.45);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 0.45);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'airstrike') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          osc.frequency.linearRampToValueAtTime(550, now + 0.3);
          osc.frequency.linearRampToValueAtTime(70, now + 1.2);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.001, now + 1.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 1.2);
        }
      } catch (e) {}
    }

    // --- ゲーム設定 ---
    const BRIDGE_WIDTH = 9.6;
    const DEFENSE_Z = 13.0;
    let isPlaying = false;
    let score = 0;
    let gameTime = 0;
    let spawnTimer = 0;
    let gateTimer = 0;
    let shakeIntensity = 0;

    let ultGauge = 0;
    let isUltReady = false;

    // Three.js
    let scene, camera, renderer;
    let sunLight, muzzleLight;
    let playerLeaderX = 0;
    let targetX = 0;
    let roadMatRef, waterMatRef;

    let squadMembers = [];
    let bullets = [];
    let zombies = [];
    let gates = [];
    let particles = [];
    let shellCasings = [];
    let boss = null;

    // --- 外部glTFアセット保持用 ---
    let baseSoldierModel = null;
    let soldierAnimations = [];

    // --- 高精細テクスチャ生成 ---
    function createRoadTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 1024; cvs.height = 1024;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#1c1f24';
      ctx.fillRect(0, 0, 1024, 1024);

      for (let i = 0; i < 9000; i++) {
        ctx.fillStyle = Math.random() < 0.5 ? '#15171b' : '#282c34';
        ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 3, 3);
      }

      ctx.fillStyle = 'rgba(10, 10, 12, 0.4)';
      for (let i = 0; i < 8; i++) {
        const tx = 200 + Math.random() * 624;
        ctx.fillRect(tx, Math.random() * 800, 36, 120 + Math.random() * 80);
      }

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(24, 0, 16, 1024);
      ctx.fillRect(984, 0, 16, 1024);

      ctx.fillStyle = '#f59e0b';
      for (let y = 20; y < 1024; y += 140) {
        ctx.fillRect(504, y, 10, 80);
        ctx.fillRect(520, y, 10, 80);
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 16);
      return tex;
    }

    function createWaterTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 512; cvs.height = 512;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = '#0284c7';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 240; i++) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        const w = 30 + Math.random() * 70;
        ctx.fillRect(Math.random() * 512, Math.random() * 512, w, 5);
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 32);
      return tex;
    }

    function createMilGateTexture(label, isPos) {
      const cvs = document.createElement('canvas');
      cvs.width = 256; cvs.height = 256;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = isPos ? 'rgba(30, 58, 138, 0.88)' : 'rgba(127, 29, 29, 0.88)';
      ctx.fillRect(0, 0, 256, 256);

      ctx.strokeStyle = isPos ? '#38bdf8' : '#f87171';
      ctx.lineWidth = 14;
      ctx.strokeRect(7, 7, 242, 242);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = 'bold 24px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isPos ? 'AIR-DROP' : 'HAZARD', 128, 50);

      ctx.fillStyle = '#ffffff';
      ctx.font = '900 84px Impact, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, 128, 140);
      return new THREE.CanvasTexture(cvs);
    }

    // --- 本物のアセットからキャラクター生成（SkeletonUtils.clone） ---
    function spawnSoldierInstance(isLeader = false) {
      const model = THREE.SkeletonUtils.clone(baseSoldierModel);
      model.scale.set(1.15, 1.15, 1.15);

      // アニメーションミキサー
      const mixer = new THREE.AnimationMixer(model);
      // Run: animations[1], Walk: animations[3], Idle: animations[0]
      const runClip = soldierAnimations[1] || soldierAnimations[0];
      const runAction = mixer.clipAction(runClip);
      runAction.play();

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.material = child.material.clone();
          if (isLeader) {
            child.material.color.setHex(0x93c5fd); // リーダーは青系迷彩
          }
        }
      });

      return { model, mixer };
    }

    function spawnZombieInstance(type = 'normal') {
      const model = THREE.SkeletonUtils.clone(baseSoldierModel);
      let scale = 1.15;
      if (type === 'runner') scale = 0.95;
      if (type === 'tank') scale = 1.9;

      model.scale.set(scale, scale, scale);

      const mixer = new THREE.AnimationMixer(model);
      let clip = soldierAnimations[3] || soldierAnimations[0]; // Walk
      let animSpeed = 0.85;

      if (type === 'runner') {
        clip = soldierAnimations[1]; // Run
        animSpeed = 1.4;
      }
      const action = mixer.clipAction(clip);
      action.timeScale = animSpeed;
      action.play();

      const mats = [];
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.material = child.material.clone();

          if (type === 'runner') {
            child.material.color.setHex(0x991b1b); // 血染めランナー
          } else if (type === 'tank') {
            child.material.color.setHex(0x1e293b); // 黒変異タンク
          } else {
            child.material.color.setHex(0x3f624d); // 腐敗グリーン
          }
          child.material.roughness = 0.85;
          mats.push(child.material);
        }
      });

      // ゾンビらしく前進方向へ反転
      model.rotation.y = Math.PI;

      return { model, mixer, mats, scale };
    }

    function spawnGoliathBossInstance() {
      const model = THREE.SkeletonUtils.clone(baseSoldierModel);
      const scale = 3.6; // 超巨大！
      model.scale.set(scale, scale, scale);

      const mixer = new THREE.AnimationMixer(model);
      const clip = soldierAnimations[3] || soldierAnimations[0]; // Walk
      const action = mixer.clipAction(clip);
      action.timeScale = 0.55; // 重厚なスロー歩行
      action.play();

      const mats = [];
      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          child.material = child.material.clone();
          child.material.color.setHex(0x450a0a); // ドス黒い赤
          child.material.roughness = 0.9;
          mats.push(child.material);
        }
      });

      model.rotation.y = Math.PI;
      return { model, mixer, mats };
    }

    // --- 初期セットアップ ---
    function init() {
      const container = document.getElementById('game-container');
      const w = container.clientWidth;
      const h = container.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x38bdf8);
      scene.fog = new THREE.FogExp2(0xbae6fd, 0.007);

      camera = new THREE.PerspectiveCamera(52, w / h, 0.1, 300);
      camera.position.set(0, 16, 24);
      camera.lookAt(0, 1, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      container.appendChild(renderer.domElement);

      // 太陽光ライティング
      const hemiLight = new THREE.HemisphereLight(0xbae6fd, 0x0284c7, 0.75);
      scene.add(hemiLight);

      sunLight = new THREE.DirectionalLight(0xfffbeb, 1.45);
      sunLight.position.set(18, 38, 15);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 0.5;
      sunLight.shadow.camera.far = 160;
      sunLight.shadow.camera.left = -16;
      sunLight.shadow.camera.right = 16;
      sunLight.shadow.camera.top = 25;
      sunLight.shadow.camera.bottom = -45;
      sunLight.shadow.bias = -0.0004;
      scene.add(sunLight);

      // マズル閃光ライト
      muzzleLight = new THREE.PointLight(0xfef08a, 0, 8, 2);
      muzzleLight.position.set(0, 1.5, DEFENSE_Z);
      scene.add(muzzleLight);

      // 海面
      waterMatRef = createWaterTexture();
      const seaMat = new THREE.MeshStandardMaterial({
        map: waterMatRef,
        roughness: 0.18,
        metalness: 0.8,
        color: 0x0284c7
      });
      const sea = new THREE.Mesh(new THREE.PlaneGeometry(300, 400), seaMat);
      sea.rotation.x = -Math.PI / 2;
      sea.position.set(0, -18, -40);
      sea.receiveShadow = true;
      scene.add(sea);

      // ベイブリッジ
      roadMatRef = createRoadTexture();
      const roadMat = new THREE.MeshStandardMaterial({
        map: roadMatRef,
        roughness: 0.82,
        metalness: 0.1
      });
      const road = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE_WIDTH, 1.0, 130), roadMat);
      road.position.set(0, -0.5, -35);
      road.receiveShadow = true;
      scene.add(road);

      // ガードレール
      const railMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.4, metalness: 0.7 });
      const railL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.7, 130), railMat);
      railL.position.set(-BRIDGE_WIDTH / 2, 0.35, -35);
      railL.castShadow = true; railL.receiveShadow = true;
      const railR = railL.clone();
      railR.position.x = BRIDGE_WIDTH / 2;
      scene.add(railL, railR);

      // 吊り橋主塔
      const towerMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.6, metalness: 0.2 });
      for (let z of [-80, -20]) {
        const pillarL = new THREE.Mesh(new THREE.BoxGeometry(1.4, 48, 1.8), towerMat);
        pillarL.position.set(-BRIDGE_WIDTH / 2 - 1.2, 22, z);
        pillarL.castShadow = true;
        const pillarR = pillarL.clone();
        pillarR.position.x = BRIDGE_WIDTH / 2 + 1.2;
        const beam = new THREE.Mesh(new THREE.BoxGeometry(BRIDGE_WIDTH + 4, 1.8, 1.8), towerMat);
        beam.position.set(0, 42, z);
        beam.castShadow = true;
        scene.add(pillarL, pillarR, beam);
      }

      // ケーブル
      const cableMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.3, metalness: 0.8 });
      const cableL = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 130), cableMat);
      cableL.rotation.x = Math.PI / 2;
      cableL.position.set(-BRIDGE_WIDTH / 2 - 1.2, 42, -35);
      const cableR = cableL.clone();
      cableR.position.x = BRIDGE_WIDTH / 2 + 1.2;
      scene.add(cableL, cableR);

      // 防衛ライン
      const defLine = new THREE.Mesh(
        new THREE.BoxGeometry(BRIDGE_WIDTH, 0.06, 0.4),
        new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.4 })
      );
      defLine.position.set(0, 0.05, DEFENSE_Z + 1.2);
      scene.add(defLine);

      setupTouchControls();
      setupUltButton();

      window.addEventListener('resize', onResize);

      // --- 外部3Dアセット（Soldier.glb）のダウンロード ---
      loadExternal3DAssets();
    }

    function loadExternal3DAssets() {
      const loader = new THREE.GLTFLoader();
      const assetUrl = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/models/gltf/Soldier.glb';

      loader.load(
        assetUrl,
        (gltf) => {
          baseSoldierModel = gltf.scene;
          soldierAnimations = gltf.animations;

          // ロード完了
          document.getElementById('loading-box').style.display = 'none';
          document.getElementById('start-btn').style.display = 'block';
          animate();
        },
        (xhr) => {
          if (xhr.total > 0) {
            const pct = Math.floor((xhr.loaded / xhr.total) * 100);
            document.getElementById('loading-text').innerText = `DOWNLOADING 3D ASSETS... (${pct}%)`;
            document.getElementById('loading-fill').style.width = `${pct}%`;
          }
        },
        (err) => {
          const eb = document.getElementById('error-box');
          eb.style.display = 'block';
          eb.innerText = '3D Asset Load Failed. Check network connection.';
        }
      );
    }

    // --- 入力制御 ---
    function setupTouchControls() {
      let isDrag = false;
      let startX = 0;
      let initX = 0;

      const onStart = (cx) => { isDrag = true; startX = cx; initX = targetX; };
      const onMove = (cx) => {
        if (!isDrag || !isPlaying) return;
        const dx = (cx - startX) * 0.025;
        const maxR = BRIDGE_WIDTH / 2 - 0.7;
        targetX = Math.max(-maxR, Math.min(maxR, initX + dx));
      };
      const onEnd = () => { isDrag = false; };

      window.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX), { passive: true });
      window.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX), { passive: true });
      window.addEventListener('touchend', onEnd);
      window.addEventListener('mousedown', (e) => onStart(e.clientX));
      window.addEventListener('mousemove', (e) => onMove(e.clientX));
      window.addEventListener('mouseup', onEnd);
    }

    function setupUltButton() {
      const btn = document.getElementById('ult-btn');
      btn.addEventListener('click', triggerAirstrike);
      btn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        triggerAirstrike();
      });
    }

    function onResize() {
      const c = document.getElementById('game-container');
      camera.aspect = c.clientWidth / c.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(c.clientWidth, c.clientHeight);
    }

    // --- 部隊編成 ---
    function updateSquadLayout() {
      document.getElementById('squad-val').innerText = squadMembers.length;
      squadMembers.forEach((m, idx) => {
        if (idx === 0) { m.offsetX = 0; m.offsetZ = 0; return; }
        const row = Math.floor(Math.sqrt(idx));
        const col = idx - row * row;
        const spX = 0.58; const spZ = 0.68;
        m.offsetX = -((row * spX) / 2) + col * spX;
        m.offsetZ = row * spZ;
      });
    }

    function addSquad(cnt) {
      playSfx('rifle');
      const cur = squadMembers.length;
      const target = Math.min(60, cur + cnt);
      for (let i = cur; i < target; i++) {
        const u = spawnSoldierInstance(false);
        u.model.position.set(playerLeaderX, 0, DEFENSE_Z);
        scene.add(u.model);
        squadMembers.push({
          mesh: u.model,
          mixer: u.mixer,
          offsetX: 0,
          offsetZ: 0
        });
      }
      updateSquadLayout();
    }

    function removeSquad(cnt) {
      if (squadMembers.length <= 1) return;
      playSfx('splat');
      shakeIntensity = 0.45;

      const vig = document.getElementById('vignette');
      vig.classList.add('hit');
      setTimeout(() => vig.classList.remove('hit'), 200);

      const removeCnt = Math.min(cnt, squadMembers.length - 1);
      for (let i = 0; i < removeCnt; i++) {
        const m = squadMembers.pop();
        spawnMeatDebris(m.mesh.position.x, 0.6, m.mesh.position.z, 0xef4444, 10);
        scene.remove(m.mesh);
      }
      updateSquadLayout();
    }

    // --- ゲート管理 ---
    function spawnGatePair() {
      const z = -65;
      const w = BRIDGE_WIDTH / 2 - 0.35;
      const leftGood = Math.random() < 0.5;

      const g1 = createMilGate(leftGood ? 6 : -4, leftGood, -w / 2 - 0.15, z, w);
      const g2 = createMilGate(!leftGood ? 6 : -4, !leftGood, w / 2 + 0.15, z, w);
      gates.push(g1, g2);
    }

    function createMilGate(val, isPos, x, z, width) {
      const g = new THREE.Group();
      const panel = new THREE.Mesh(
        new THREE.PlaneGeometry(width, 2.8),
        new THREE.MeshBasicMaterial({ transparent: true, side: THREE.DoubleSide })
      );
      panel.position.y = 1.5;
      g.add(panel);

      const frameMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5, metalness: 0.4 });
      const pL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.2, 0.3), frameMat);
      pL.position.set(-width / 2, 1.5, 0);
      pL.castShadow = true;
      const pR = pL.clone(); pR.position.x = width / 2;
      const topBar = new THREE.Mesh(new THREE.BoxGeometry(width + 0.3, 0.3, 0.3), frameMat);
      topBar.position.set(0, 3.0, 0);
      topBar.castShadow = true;
      g.add(pL, pR, topBar);

      g.position.set(x, 0, z);
      scene.add(g);

      const obj = { mesh: g, panel, val, isPos, width, applied: false };
      updateGateTexture(obj);
      return obj;
    }

    function updateGateTexture(g) {
      const txt = g.isPos ? `+${g.val}` : `${g.val}`;
      g.panel.material.map = createMilGateTexture(txt, g.isPos);
      g.panel.material.needsUpdate = true;
    }

    // --- ダメージ表示 ---
    function showDamageNumber(val, x, y, z, isCrit = false) {
      const vector = new THREE.Vector3(x, y, z);
      vector.project(camera);

      const sx = (vector.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-(vector.y * 0.5) + 0.5) * window.innerHeight;

      const div = document.createElement('div');
      div.className = `dmg-num ${isCrit ? 'crit' : ''}`;
      div.innerText = isCrit ? `CRIT ${val}!` : `${val}`;
      div.style.left = `${sx}px`;
      div.style.top = `${sy}px`;
      document.getElementById('damage-layer').appendChild(div);

      gsap.to(div, {
        y: sy - 40,
        opacity: 0,
        duration: 0.6,
        ease: 'power2.out',
        onComplete: () => div.remove()
      });
    }

    // --- 空爆爆撃（AIRSTRIKE） ---
    function triggerAirstrike() {
      if (!isUltReady || !isPlaying) return;
      isUltReady = false;
      ultGauge = 0;
      updateUltUi();

      playSfx('airstrike');
      shakeIntensity = 1.35;

      const jet = new THREE.Mesh(
        new THREE.ConeGeometry(0.9, 4.2, 6),
        new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6, roughness: 0.3 })
      );
      jet.rotation.x = Math.PI / 2;
      jet.position.set(playerLeaderX, 22, DEFENSE_Z + 15);
      jet.castShadow = true;
      scene.add(jet);

      gsap.to(jet.position, {
        z: -90,
        duration: 0.8,
        ease: 'none',
        onComplete: () => scene.remove(jet)
      });

      for (let k = 0; k < 6; k++) {
        setTimeout(() => {
          if (!isPlaying) return;
          const boomZ = -8 - k * 9;
          const boomX = (Math.random() - 0.5) * (BRIDGE_WIDTH - 2);

          playSfx('explosion');
          shakeIntensity = 0.9;
          spawnExplosionSmoke(boomX, 0.5, boomZ, 35);

          for (let i = zombies.length - 1; i >= 0; i--) {
            const z = zombies[i];
            if (Math.abs(z.mesh.position.z - boomZ) < 6.5) {
              z.hp -= 30;
              showDamageNumber(30, z.mesh.position.x, 1, z.mesh.position.z, true);
              if (z.hp <= 0) {
                spawnMeatDebris(z.mesh.position.x, 0.7, z.mesh.position.z, 0xef4444, 15);
                scene.remove(z.mesh);
                zombies.splice(i, 1);
                score++;
                document.getElementById('score-val').innerText = score;
              }
            }
          }

          if (boss && Math.abs(boss.mesh.position.z - boomZ) < 8.0) {
            boss.hp -= 25;
            showDamageNumber(25, boss.mesh.position.x, 2.5, boss.mesh.position.z, true);
            updateBossHp();
          }
        }, k * 110);
      }
    }

    function chargeUlt(amt) {
      if (isUltReady) return;
      ultGauge = Math.min(100, ultGauge + amt);
      if (ultGauge >= 100) isUltReady = true;
      updateUltUi();
    }

    function updateUltUi() {
      const btn = document.getElementById('ult-btn');
      const pct = document.getElementById('ult-pct');
      pct.innerText = `${Math.floor(ultGauge)}%`;
      if (isUltReady) btn.classList.add('ready');
      else btn.classList.remove('ready');
    }

    // --- スタート / リセット ---
    function startGame() {
      initAudio();
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'none';

      squadMembers.forEach(m => scene.remove(m.mesh));
      bullets.forEach(b => scene.remove(b.mesh));
      zombies.forEach(z => scene.remove(z.mesh));
      gates.forEach(g => scene.remove(g.mesh));
      particles.forEach(p => scene.remove(p.mesh));
      shellCasings.forEach(sc => scene.remove(sc.mesh));
      if (boss) scene.remove(boss.mesh);

      squadMembers = [];
      bullets = [];
      zombies = [];
      gates = [];
      particles = [];
      shellCasings = [];
      boss = null;

      score = 0;
      gameTime = 0;
      spawnTimer = 0;
      gateTimer = 1.0;
      shakeIntensity = 0;
      ultGauge = 0;
      isUltReady = false;
      playerLeaderX = 0;
      targetX = 0;

      // 自軍リーダーの出撃（本物の3D兵士モデル）
      const leader = spawnSoldierInstance(true);
      leader.model.position.set(0, 0, DEFENSE_Z);
      scene.add(leader.model);
      squadMembers.push({
        mesh: leader.model,
        mixer: leader.mixer,
        offsetX: 0,
        offsetZ: 0
      });

      updateSquadLayout();
      updateUltUi();
      document.getElementById('score-val').innerText = '0';
      document.getElementById('boss-hud').style.display = 'none';

      isPlaying = true;
    }

    function spawnCasing(x, y, z) {
      const casing = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 0.12, 6),
        new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.9, roughness: 0.2 })
      );
      casing.rotation.z = Math.PI / 2;
      casing.position.set(x, y, z);
      scene.add(casing);

      shellCasings.push({
        mesh: casing,
        vx: 0.08 + Math.random() * 0.05,
        vy: 0.12 + Math.random() * 0.08,
        vz: (Math.random() - 0.5) * 0.05,
        life: 0.45
      });
    }

    function spawnMeatDebris(x, y, z, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.08 + Math.random() * 0.06, 6, 6),
          new THREE.MeshStandardMaterial({ color, roughness: 0.6 })
        );
        p.position.set(x, y, z);
        p.castShadow = true;
        scene.add(p);
        particles.push({
          mesh: p,
          vx: (Math.random() - 0.5) * 0.38,
          vy: Math.random() * 0.35 + 0.12,
          vz: (Math.random() - 0.5) * 0.38,
          life: 0.55
        });
      }
    }

    function spawnExplosionSmoke(x, y, z, count = 25) {
      for (let i = 0; i < count; i++) {
        const isFire = Math.random() < 0.4;
        const p = new THREE.Mesh(
          new THREE.SphereGeometry(0.35 + Math.random() * 0.3, 6, 6),
          new THREE.MeshStandardMaterial({ color: isFire ? 0xf97316 : 0x1f2937, roughness: 0.9 })
        );
        p.position.set(x, y, z);
        scene.add(p);
        particles.push({
          mesh: p,
          vx: (Math.random() - 0.5) * 0.45,
          vy: Math.random() * 0.5 + 0.18,
          vz: (Math.random() - 0.5) * 0.45,
          life: 0.75
        });
      }
    }

    function updateBossHp() {
      if (!boss) return;
      const pct = Math.max(0, (boss.hp / boss.maxHp) * 100);
      document.getElementById('boss-bar-fill').style.width = `${pct}%`;
    }

    // --- メインループ ---
    let shootCool = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = 0.016;

      if (isPlaying) {
        gameTime += delta;

        bgmTimer -= delta;
        if (bgmTimer <= 0) {
          stepBgm();
          bgmTimer = 0.13;
        }

        if (roadMatRef) roadMatRef.offset.y -= 0.012;
        if (waterMatRef) waterMatRef.offset.y -= 0.006;

        if (shakeIntensity > 0) {
          camera.position.x = (Math.random() - 0.5) * shakeIntensity;
          camera.position.y = 16 + (Math.random() - 0.5) * shakeIntensity;
          shakeIntensity *= 0.88;
          if (shakeIntensity < 0.01) { shakeIntensity = 0; camera.position.set(0, 16, 24); }
        }

        if (muzzleLight.intensity > 0) muzzleLight.intensity -= 0.6;

        playerLeaderX += (targetX - playerLeaderX) * 0.22;

        // 味方兵士の更新（ボーンアニメーション＆隊列移動）
        squadMembers.forEach(m => {
          m.mesh.position.x += (playerLeaderX + m.offsetX - m.mesh.position.x) * 0.25;
          m.mesh.position.z += (DEFENSE_Z + m.offsetZ - m.mesh.position.z) * 0.25;
          if (m.mixer) m.mixer.update(delta);
        });

        // 射撃ロジック
        shootCool -= delta;
        const cooldown = 0.13;
        if (shootCool <= 0) {
          shootCool = cooldown;
          playSfx('rifle');

          muzzleLight.position.set(playerLeaderX, 1.2, DEFENSE_Z - 0.5);
          muzzleLight.intensity = 2.4;

          squadMembers.forEach(m => {
            const b = new THREE.Mesh(
              new THREE.SphereGeometry(0.16, 6, 6),
              new THREE.MeshBasicMaterial({ color: 0xf59e0b })
            );
            b.position.set(m.mesh.position.x + 0.26, 0.75, m.mesh.position.z - 0.5);
            scene.add(b);

            bullets.push({
              mesh: b,
              vz: -0.82,
              vx: (Math.random() - 0.5) * 0.02,
              penetration: 2
            });

            spawnCasing(m.mesh.position.x + 0.35, 0.75, m.mesh.position.z - 0.2);
          });
        }

        gateTimer -= delta;
        if (gateTimer <= 0 && gates.length === 0 && !boss) {
          spawnGatePair();
          gateTimer = 8.5;
        }

        // ゾンビ大群スポーン（本物のアセットモデル）
        spawnTimer -= delta;
        if (spawnTimer <= 0 && !boss) {
          const hordeCount = Math.floor(Math.random() * 3) + 3;

          for (let k = 0; k < hordeCount; k++) {
            const types = ['normal', 'normal', 'normal', 'runner', 'tank'];
            const type = types[Math.floor(Math.random() * types.length)];
            const x = (Math.random() - 0.5) * (BRIDGE_WIDTH - 1.5);
            const zOffset = -65 - Math.random() * 8;

            const zObj = spawnZombieInstance(type);
            zObj.model.position.set(x, 0, zOffset);
            scene.add(zObj.model);

            let hp = 3;
            let spd = 0.09 + Math.random() * 0.02;
            if (type === 'runner') { hp = 2; spd = 0.18 + Math.random() * 0.03; }
            if (type === 'tank') { hp = 15; spd = 0.045; }

            zombies.push({
              mesh: zObj.model,
              mixer: zObj.mixer,
              mats: zObj.mats,
              hp,
              type,
              speed: spd
            });
          }

          spawnTimer = Math.max(0.35, 1.1 - gameTime * 0.015);
        }

        // 巨大ボスの出現
        if (!boss && (gameTime > 42 || score >= 180)) {
          const bObj = spawnGoliathBossInstance();
          bObj.model.position.set(0, 0, -75);
          scene.add(bObj.model);

          boss = {
            mesh: bObj.model,
            mixer: bObj.mixer,
            mats: bObj.mats,
            hp: 300,
            maxHp: 300,
            speed: 0.024
          };
          document.getElementById('boss-hud').style.display = 'flex';
          shakeIntensity = 0.8;
          playSfx('splat');
        }

        // --- 1. 弾丸判定 ---
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.mesh.position.z += b.vz;
          b.mesh.position.x += b.vx;

          if (b.mesh.position.z < -80) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
            continue;
          }

          let hit = false;

          for (let g of gates) {
            if (Math.abs(b.mesh.position.z - g.mesh.position.z) < 0.6 &&
                Math.abs(b.mesh.position.x - g.mesh.position.x) < g.width / 2) {
              hit = true;
              if (g.isPos) {
                g.val = Math.min(30, g.val + 1);
                updateGateTexture(g);
                spawnMeatDebris(b.mesh.position.x, 1.5, b.mesh.position.z, 0x38bdf8, 3);
              } else {
                g.val = Math.min(0, g.val + 1);
                updateGateTexture(g);
                spawnMeatDebris(b.mesh.position.x, 1.5, b.mesh.position.z, 0xef4444, 3);
                if (g.val >= 0) {
                  playSfx('explosion');
                  spawnExplosionSmoke(g.mesh.position.x, 1.5, g.mesh.position.z, 20);
                  scene.remove(g.mesh);
                  gates.splice(gates.indexOf(g), 1);
                }
              }
              break;
            }
          }

          if (!hit) {
            for (let j = zombies.length - 1; j >= 0; j--) {
              const z = zombies[j];
              const hitRadius = z.type === 'tank' ? 1.4 : 0.85;

              if (z.mesh.position.distanceTo(b.mesh.position) < hitRadius) {
                const isCrit = Math.random() < 0.2;
                const dmg = isCrit ? 3 : 1;
                z.hp -= dmg;
                b.penetration--;
                if (b.penetration <= 0) hit = true;

                chargeUlt(1.5);
                playSfx('splat');
                showDamageNumber(dmg, b.mesh.position.x, 1.2, b.mesh.position.z, isCrit);
                spawnMeatDebris(b.mesh.position.x, 0.7, b.mesh.position.z, 0x5a7d65, 3);

                // ヒットストロボフラッシュ
                z.mats.forEach(mat => mat.emissive.setHex(0xffffff));
                setTimeout(() => {
                  z.mats.forEach(mat => mat.emissive.setHex(0x000000));
                }, 60);

                z.mesh.position.z -= 0.18;

                if (z.hp <= 0) {
                  spawnMeatDebris(z.mesh.position.x, 0.7, z.mesh.position.z, 0xef4444, z.type === 'tank' ? 30 : 12);
                  scene.remove(z.mesh);
                  zombies.splice(j, 1);
                  score++;
                  document.getElementById('score-val').innerText = score;
                }
                break;
              }
            }
          }

          if (!hit && boss) {
            const bx = boss.mesh.position.x;
            const bz = boss.mesh.position.z;

            if (Math.abs(b.mesh.position.x - bx) < 2.2 && Math.abs(b.mesh.position.z - bz) < 2.5) {
              const isCrit = Math.random() < 0.25;
              const dmg = isCrit ? 3 : 1;
              boss.hp -= dmg;
              hit = true;
              chargeUlt(1.5);
              playSfx('splat');
              showDamageNumber(dmg, bx, 2.5, bz, isCrit);
              updateBossHp();

              boss.mats.forEach(mat => mat.emissive.setHex(0xffffff));
              setTimeout(() => {
                boss.mats.forEach(mat => mat.emissive.setHex(0x000000));
              }, 60);

              if (boss.hp <= 0) {
                spawnMeatDebris(bx, 3.0, bz, 0xef4444, 80);
                shakeIntensity = 1.4;
                playSfx('explosion');
                scene.remove(boss.mesh);
                boss = null;
                score += 100;
                document.getElementById('score-val').innerText = score;
                endGame(true);
                return;
              }
            }
          }

          if (hit) {
            scene.remove(b.mesh);
            bullets.splice(i, 1);
          }
        }

        // --- 2. ゾンビの移動＆アニメ更新 ---
        for (let i = zombies.length - 1; i >= 0; i--) {
          const z = zombies[i];
          z.mesh.position.z += z.speed;
          if (z.mixer) z.mixer.update(delta);

          if (z.mesh.position.z >= DEFENSE_Z) {
            playSfx('splat');
            shakeIntensity = 0.5;
            spawnMeatDebris(z.mesh.position.x, 0.6, z.mesh.position.z, 0xef4444, 15);
            scene.remove(z.mesh);
            zombies.splice(i, 1);

            removeSquad(z.type === 'tank' ? 3 : 1);
            if (squadMembers.length <= 0) {
              endGame(false);
              return;
            }
          }
        }

        // ボス移動＆アニメ
        if (boss) {
          boss.mesh.position.z += boss.speed;
          if (boss.mixer) boss.mixer.update(delta);

          if (boss.mesh.position.z >= DEFENSE_Z - 1.5) {
            endGame(false);
            return;
          }
        }

        // ゲート通過
        for (let i = gates.length - 1; i >= 0; i--) {
          const g = gates[i];
          g.mesh.position.z += 0.11;
          if (!g.applied && Math.abs(g.mesh.position.z - DEFENSE_Z) < 1.0) {
            const left = g.mesh.position.x - g.width / 2;
            const right = g.mesh.position.x + g.width / 2;
            if (playerLeaderX >= left && playerLeaderX <= right) {
              g.applied = true;
              shakeIntensity = 0.25;
              if (g.isPos) addSquad(g.val);
              else removeSquad(Math.abs(g.val));
            }
          }
          if (g.mesh.position.z > DEFENSE_Z + 4) {
            scene.remove(g.mesh);
            gates.splice(i, 1);
          }
        }

        // 薬莢物理
        for (let i = shellCasings.length - 1; i >= 0; i--) {
          const sc = shellCasings[i];
          sc.mesh.position.x += sc.vx;
          sc.mesh.position.y += sc.vy;
          sc.mesh.position.z += sc.vz;
          sc.vy -= 0.015;
          sc.mesh.rotation.x += 0.2;
          sc.life -= delta;
          if (sc.life <= 0) {
            scene.remove(sc.mesh);
            shellCasings.splice(i, 1);
          }
        }

        // パーティクル更新
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.mesh.position.x += p.vx;
          p.mesh.position.y += p.vy;
          p.mesh.position.z += p.vz;
          p.vy -= 0.012;
          p.life -= delta;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
          }
        }
      }

      renderer.render(scene, camera);
    }

    // --- リザルト画面 ---
    function endGame(isClear) {
      isPlaying = false;
      const res = document.getElementById('result-screen');
      const title = document.getElementById('result-title');
      const desc = document.getElementById('result-desc');

      if (isClear) {
        title.innerText = 'SECTOR SECURED';
        title.style.color = '#22c55e';
        desc.innerHTML = `変異巨獣ゴライアスを完全殲滅！<br>ゾンビのアウトブレイクを封じ込めた！<br><br>討伐数: <b>${score}体</b><br>残存戦力: <b>${squadMembers.length}名</b>`;
      } else {
        title.innerText = 'OVERRUN BY HORDE';
        title.style.color = '#ef4444';
        desc.innerHTML = `ゾンビの群れに防衛線を突破された...<br><br>討伐数: <b>${score}体</b>`;
      }
      res.style.display = 'flex';
    }

    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry-btn').addEventListener('click', startGame);
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
